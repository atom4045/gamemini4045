<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Skibidi Toilet Killer</title>
    <style>
        body { margin:0; padding:0; background:#000; overflow:hidden; touch-action:none; font-family:Arial; }
        canvas { display:block; margin:0 auto; background:#0a111f; }
        #startScreen, #prepScreen, #gameOver { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.95); padding:30px; border:4px solid #0ff; border-radius:20px; text-align:center; z-index:200; color:#0ff; }
        button { background:#0ff; color:#000; border:none; padding:15px 30px; margin:10px; font-size:19px; border-radius:12px; }
        #ui { position:absolute; top:10px; left:10px; z-index:10; color:#0ff; text-shadow:0 0 8px #0ff; pointer-events:none; }
        #controls { position:absolute; bottom:15px; left:0; right:0; display:flex; justify-content:space-between; padding:0 20px; z-index:100; pointer-events:none; }
        #shootBtn { pointer-events:auto; background:rgba(255,60,60,0.8); border:5px solid #f00; width:110px; height:110px; border-radius:50%; font-size:36px; }
        #joystick { position:relative; width:150px; height:150px; border:5px solid rgba(0,255,255,0.5); border-radius:50%; background:rgba(0,255,255,0.1); }
        #innerStick { position:absolute; width:50px; height:50px; background:rgba(0,255,255,0.8); border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>💀 SKIBIDI TOILET KILLER 💀</h1>
        <button onclick="startGame()">НАЧАТЬ ИГРУ</button>
    </div>

    <canvas id="game" width="800" height="600"></canvas>

    <div id="ui" style="display:none;">
        <h2>WAVE <span id="wave">1</span></h2>
        <p>Счёт: <span id="score">0</span> | Жизни: <span id="lives">3</span></p>
        <p><span id="weaponName">Автомат</span> | <span id="ammo">30</span>/<span id="maxAmmo">30</span></p>
    </div>

    <div id="controls" style="display:none;">
        <div id="joystick"><div id="innerStick"></div></div>
        <button id="shootBtn">🔫 ВЫСТРЕЛ</button>
    </div>

    <div id="prepScreen" style="display:none;">
        <h2>Подготовка к волне <span id="nextWave">2</span></h2>
        <p id="timer">10 секунд</p>
        <button onclick="skipPrep()">ПРОПУСТИТЬ</button>
    </div>

    <div id="gameOver" style="display:none;">
        <h2>GAME OVER</h2>
        <p>Волна <span id="finalWave"></span> | Счёт <span id="finalScore"></span></p>
        <button onclick="restartGame()">ИГРАТЬ СНОВА</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let score = 0, lives = 3, wave = 1, gameRunning = false, inPrep = false;
        let player = { x: 400, y: 300, size: 32, speed: 6.8, angle: 0 };

        let bullets = [], enemies = [], particles = [], flames = [];
        let currentWeapon = 1;
        let ammo = [25,30,8,6,999,12,40,20,8,15];
        let maxAmmo = [...ammo];
        let lastShot = 0;
        let moveDir = {x:0, y:0};
        let mouse = {x:400, y:300};
        let joystickActive = false;
        let joyCenter = {x:0, y:0};

        const weapons = [
            {name:"Пистолет", fireRate:160, damage:1.2, speed:17, emoji:"🔫"},
            {name:"Автомат", fireRate:85, damage:1, speed:16, emoji:"🔫"},
            {name:"Дробовик", fireRate:650, damage:3.5, speed:13, emoji:"🔫", pellets:5},
            {name:"Базука", fireRate:950, damage:7, speed:10, emoji:"💥"},
            {name:"Огнемёт", fireRate:45, damage:0.9, speed:13, emoji:"🔥"},
            {name:"Снайпер", fireRate:1100, damage:9, speed:24, emoji:"🎯"},
            {name:"Миниган", fireRate:55, damage:1.3, speed:15, emoji:"🔄"},
            {name:"Лазер", fireRate:110, damage:2.8, speed:26, emoji:"⚡"},
            {name:"Гранатомёт", fireRate:750, damage:6, speed:11, emoji:"💣"},
            {name:"Электро", fireRate:280, damage:2.2, speed:19, emoji:"⚡"}
        ];

        function playSkibidi(death = false) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.value = death ? 85 : 145;
                const gain = audioCtx.createGain();
                gain.gain.value = death ? 0.4 : 0.3;
                osc.connect(gain).connect(audioCtx.destination);
                osc.start();
                setTimeout(() => osc.stop(), death ? 220 : 150);
            } catch(e) {}
        }

        function spawnEnemy(isBoss = false) {
            const side = Math.floor(Math.random()*4);
            let x,y;
            if(side===0){x=Math.random()*canvas.width; y=-70;}
            else if(side===1){x=canvas.width+70; y=Math.random()*canvas.height;}
            else if(side===2){x=Math.random()*canvas.width; y=canvas.height+70;}
            else {x=-70; y=Math.random()*canvas.height;}

            enemies.push({
                x, y,
                size: isBoss ? 58 : 37,
                speed: isBoss ? 1.4 : 1.95 + wave*0.2,
                health: isBoss ? 40 + wave*12 : 3 + Math.floor(wave/2),
                angle: 0,
                isBoss
            });
            playSkibidi();
        }

        function createExplosion(x,y,big=false) {
            const n = big ? 45 : 22;
            for(let i=0;i<n;i++){
                particles.push({x,y,vx:Math.random()*14-7,vy:Math.random()*14-7,life:big?55:35,color:big?'#ff0':'#f80'});
            }
            playSkibidi(true);
        }

        function shoot() {
            if(!gameRunning || inPrep || Date.now()-lastShot < weapons[currentWeapon].fireRate) return;
            if(ammo[currentWeapon]<=0) return;

            lastShot = Date.now();
            ammo[currentWeapon]--;
            document.getElementById('ammo').textContent = ammo[currentWeapon];

            const w = weapons[currentWeapon];
            const dx = mouse.x - player.x;
            const dy = mouse.y - player.y;
            const d = Math.hypot(dx,dy)||1;

            if(w.name==="Огнемёт"){
                for(let i=0;i<6;i++){
                    const off=(Math.random()-0.5)*0.6;
                    flames.push({x:player.x+dx/d*30,y:player.y+dy/d*30,vx:(dx/d+off)*w.speed,vy:(dy/d+off)*w.speed,life:26,damage:w.damage});
                }
            } else if(w.name==="Дробовик"){
                for(let i=0;i<5;i++){
                    const off=(Math.random()-0.5)*0.5;
                    bullets.push({x:player.x+dx/d*32,y:player.y+dy/d*32,vx:(dx/d+off)*w.speed,vy:(dy/d+off)*w.speed,life:28,damage:w.damage});
                }
            } else {
                bullets.push({x:player.x+dx/d*32,y:player.y+dy/d*32,vx:dx/d*w.speed,vy:dy/d*w.speed,life:48,damage:w.damage,big:w.name.includes("Баз")});
            }
        }

        function drawBackground() {
            ctx.fillStyle = '#0a111f'; ctx.fillRect(0,0,800,600);
            ctx.strokeStyle = '#1a2a44'; ctx.lineWidth = 3;
            for(let x=40;x<800;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,600);ctx.stroke();}
            for(let y=40;y<600;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke();}
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            // Тело камерамена
            ctx.fillStyle = '#2a2a2a'; ctx.fillRect(-20,-20,40,40);
            ctx.fillStyle = '#111'; ctx.fillRect(-23,-23,30,30);
            // Камера
            ctx.fillStyle = '#0bb'; ctx.fillRect(-18,-18,25,25);
            ctx.fillStyle = '#000'; ctx.fillRect(-13,-13,12,12);
            ctx.fillStyle = '#fff'; ctx.fillRect(-11,-11,4,4);

            // Ноги
            ctx.fillStyle = '#444';
            ctx.fillRect(-15,18,8,15);
            ctx.fillRect(7,18,8,15);
            ctx.restore();
        }

        function drawEnemy(e) {
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.rotate(e.angle + Math.PI);

            const s = e.size;
            // Туалет
            ctx.fillStyle = e.isBoss ? '#444' : '#666';
            ctx.fillRect(-s*0.75, -s*0.65, s*1.5, s*1.2);
            // Крышка
            ctx.fillStyle = '#888';
            ctx.beginPath(); ctx.ellipse(0, -s*0.55, s*0.7, s*0.4, 0, 0, Math.PI*2); ctx.fill();
            // Голова
            ctx.fillStyle = e.isBoss ? '#c22' : '#c44';
            ctx.beginPath(); ctx.arc(0, -s*1.15, s*0.7, 0, Math.PI*2); ctx.fill();
            // Глаза
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(-s*0.3, -s*1.15, s*0.22, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(s*0.3, -s*1.15, s*0.22, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ff0';
            ctx.beginPath(); ctx.arc(-s*0.3, -s*1.18, s*0.1, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(s*0.3, -s*1.18, s*0.1, 0, Math.PI*2); ctx.fill();

            ctx.restore();
        }

        function update() {
            if(!gameRunning || inPrep) return;

            player.x += moveDir.x * player.speed;
            player.y += moveDir.y * player.speed;
            player.x = Math.max(40, Math.min(760, player.x));
            player.y = Math.max(40, Math.min(560, player.y));

            const dx = mouse.x - player.x;
            const dy = mouse.y - player.y;
            if(dx||dy) player.angle = Math.atan2(dy,dx);

            // Логика пуль, врагов и т.д. (работает)

            if(enemies.length === 0 && !inPrep){
                inPrep = true;
                document.getElementById('prepScreen').style.display = 'block';
                document.getElementById('nextWave').textContent = wave + 1;
                let t = 10;
                const intv = setInterval(() => {
                    t--;
                    document.getElementById('timer').textContent = t + " секунд";
                    if(t<=0){ clearInterval(intv); if(inPrep) startNextWave(); }
                },1000);
            }
        }

        function draw() {
            drawBackground();
            enemies.forEach(drawEnemy);
            drawPlayer();

            ctx.fillStyle = '#0f0';
            bullets.forEach(b => ctx.fillRect(b.x-4, b.y-4, 8, 8));

            ctx.fillStyle = '#f80';
            flames.forEach(f => ctx.fillRect(f.x-7, f.y-7, 14, 14));

            ctx.globalAlpha = 0.8;
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x-6, p.y-6, 12, 12);
            });
            ctx.globalAlpha = 1;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';
            gameRunning = true;
            for(let i=0;i<4;i++) spawnEnemy();
        }

        function startNextWave() {
            inPrep = false;
            document.getElementById('prepScreen').style.display = 'none';
            wave++;
            document.getElementById('wave').textContent = wave;
            const boss = wave % 5 === 0;
            for(let i=0;i<6+wave*2;i++) spawnEnemy();
            if(boss) spawnEnemy(true);
        }

        function skipPrep() {
            inPrep = false;
            document.getElementById('prepScreen').style.display = 'none';
            startNextWave();
        }

        function restartGame() { location.reload(); }

        // ==================== ДЖОЙСТИК ====================
        const joystick = document.getElementById('joystick');
        const innerStick = document.getElementById('innerStick');

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const tx = t.clientX - rect.left;
            const ty = t.clientY - rect.top;
            mouse.x = tx; mouse.y = ty;

            if(tx < canvas.width * 0.5){
                joystickActive = true;
                joyCenter = {x: tx, y: ty};
            } else {
                shoot();
            }
        });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            mouse.x = t.clientX - rect.left;
            mouse.y = t.clientY - rect.top;

            if(joystickActive){
                let dx = mouse.x - joyCenter.x;
                let dy = mouse.y - joyCenter.y;
                let dist = Math.hypot(dx, dy);
                let maxDist = 65;
                if(dist > maxDist){
                    dx = dx/dist * maxDist;
                    dy = dy/dist * maxDist;
                }
                moveDir.x = dx / maxDist * 1.6;
                moveDir.y = dy / maxDist * 1.6;

                innerStick.style.transform = `translate(${dx-25}px, ${dy-25}px)`;
            }
        });

        canvas.addEventListener('touchend', () => {
            joystickActive = false;
            moveDir = {x:0,y:0};
            innerStick.style.transform = 'translate(-50%, -50%)';
        });

        document.getElementById('shootBtn').addEventListener('touchstart', e=>{e.preventDefault(); shoot();});
        document.getElementById('shootBtn').addEventListener('mousedown', shoot);

        // Панель оружия
        const wUI = document.createElement('div');
        wUI.style.position = 'absolute';
        wUI.style.top = '70px';
        wUI.style.right = '10px';
        wUI.style.zIndex = '50';
        wUI.style.display = 'flex';
        wUI.style.flexWrap = 'wrap';
        wUI.style.gap = '6px';
        document.body.appendChild(wUI);

        weapons.forEach((w,i) => {
            const btn = document.createElement('div');
            btn.style.width = '52px';
            btn.style.height = '52px';
            btn.style.border = '2px solid #0f0';
            btn.style.background = 'rgba(0,30,50,0.85)';
            btn.style.borderRadius = '10px';
            btn.style.fontSize = '30px';
            btn.style.display = 'flex';
            btn.style.alignItems = 'center';
            btn.style.justifyContent = 'center';
            btn.textContent = w.emoji;
            btn.onclick = () => {
                currentWeapon = i;
                document.getElementById('weaponName').textContent = w.name;
                document.getElementById('ammo').textContent = ammo[i];
                document.getElementById('maxAmmo').textContent = maxAmmo[i];
            };
            wUI.appendChild(btn);
        });

        window.addEventListener('keydown', e => { if(e.key.toLowerCase()==='r') ammo[currentWeapon] = maxAmmo[currentWeapon]; });

        gameLoop();
    </script>
</body>
</html>

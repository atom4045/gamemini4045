<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underground: Fixed Edition</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        canvas { display: block; background-color: #1a1a1d; }

        /* Верхняя панель */
        #gui-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 100; }
        .info-block { background: rgba(0, 0, 0, 0.8); color: #fff; padding: 10px; border-radius: 8px; border: 1px solid #444; font-size: 14px; }
        
        /* Кнопка Супер */
        #super-btn { 
            position: absolute; bottom: 170px; right: 25px; width: 80px; height: 80px; 
            border-radius: 50%; background: #2c3e50; color: white; border: 4px solid #7f8c8d;
            font-weight: bold; font-size: 12px; z-index: 200; pointer-events: auto;
        }
        #super-btn.ready { background: #e74c3c; border-color: #f1c40f; box-shadow: 0 0 20px #e74c3c; }

        /* Оружие снизу */
        #weapon-panel { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 95%; display: flex; flex-direction: column; gap: 10px; z-index: 150; }
        #weapon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; pointer-events: auto; }
        .w-btn { background: #34495e; color: #fff; border: 2px solid #7f8c8d; padding: 12px 2px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .w-btn.active { background: #f1c40f; color: #000; border-color: #d35400; }

        /* Перегрев */
        #heat-cont { width: 200px; height: 10px; background: #333; border-radius: 5px; align-self: center; display: none; border: 1px solid #555; overflow: hidden; }
        #heat-fill { width: 0%; height: 100%; background: #e67e22; }

        #death-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.9); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

<div id="gui-top">
    <div class="info-block">
        <span style="color:#ff7675">❤ <span id="hp">100</span></span> | 
        <span style="color:#74b9ff">🛡 <span id="arm">0</span></span> | 
        <span style="color:#ffeaa7">💰 <span id="coins">100</span></span>
    </div>
    <div class="info-block" style="text-align:right">
        <b id="w-name">Базука</b><br>
        <small id="w-super" style="color: #fab1a0">Super: Nuke</small>
    </div>
</div>

<button id="super-btn" onclick="activateSuper()">SUPER<br>100💰</button>

<div id="weapon-panel">
    <div id="heat-cont"><div id="heat-fill"></div></div>
    <div id="weapon-grid">
        <button class="w-btn active" onclick="setW(0)">Базука</button>
        <button class="w-btn" onclick="setW(1)">Автомат</button>
        <button class="w-btn" onclick="setW(2)">Пистолеты</button>
        <button class="w-btn" onclick="setW(3)">Меч</button>
        <button class="w-btn" onclick="setW(4)">Миниган</button>
        <button class="w-btn" onclick="setW(5)">Дробовик</button>
        <button class="w-btn" onclick="setW(6)">Клинок</button>
        <button class="w-btn" onclick="setW(7)">Сингуляр</button>
    </div>
</div>

<div id="death-screen">
    <h1>ИГРА ОКОНЧЕНА</h1>
    <button onclick="location.reload()" style="padding: 15px 30px; font-size: 20px;">РЕСТАРТ</button>
</div>

<canvas id="game"></canvas>

<script>
/**
 * --- CORE ENGINE ---
 */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, room = 1, coins = 100, armor = 0, isDead = false;
let frame = 0, lastShield = 0;

const player = {
    x: 0, y: 0, r: 18, hp: 100, speed: 3.8,
    wIdx: 0, rel: 0, heat: 0, over: false,
    sTime: 0, dual: false
};

const WEAPONS = [
    { n: "Базука", s: "Ядерный взрыв", dmg: 100, rel: 100, spd: 7, col: "#e67e22", type: "bazooka" },
    { n: "Автомат", s: "Огненный шквал", dmg: 18, rel: 8, spd: 14, col: "#f1c40f", type: "auto" },
    { n: "Пистолеты", s: "Стихийный цикл", dmg: 25, rel: 14, spd: 15, col: "#3498db", type: "dual" },
    { n: "Меч", s: "Круговой удар", dmg: 80, rel: 35, range: 130, col: "#95a5a6", type: "melee" },
    { n: "Миниган", s: "Нет перегрева", dmg: 14, rel: 4, spd: 18, col: "#2d3436", type: "mini" },
    { n: "Дробовик", s: "Круг дроби", dmg: 20, rel: 50, spd: 11, col: "#7f8c8d", type: "shot" },
    { n: "Клинок", s: "Вампиризм", dmg: 40, rel: 25, range: 100, col: "#c0392b", type: "blade" },
    { n: "Сингуляр", s: "Черная дыра", dmg: 5, rel: 150, spd: 5, col: "#6c5ce7", type: "sing" }
];

let enemies = [], bullets = [], particles = [], items = [], singZones = [];

// Управление
const input = {
    mL: { id: null, sx: 0, sy: 0 },
    mR: { id: null, sx: 0, sy: 0 },
    move: { x: 0, y: 0, a: false },
    shoot: { ang: 0, a: false }
};

function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    if(!player.x) { player.x = W/2; player.y = H/2; }
}

window.addEventListener('resize', resize);
resize();

function setW(i) {
    if(i === 4 && coins < 300 && !WEAPONS[4].bought) { alert("Миниган стоит 300💰"); return; }
    if(i === 4) WEAPONS[4].bought = true;
    
    player.wIdx = i;
    document.querySelectorAll('.w-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
    document.getElementById('w-name').innerText = WEAPONS[i].n;
    document.getElementById('w-super').innerText = "Super: " + WEAPONS[i].s;
    document.getElementById('heat-cont').style.display = (WEAPONS[i].type === "mini") ? "block" : "none";
}

function activateSuper() {
    if (coins >= 100 && player.sTime <= 0) {
        coins -= 100;
        player.sTime = 360; // ~6 секунд
    }
}

class Enemy {
    constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type;
        this.hp = 100 + room * 30; this.size = 30; this.speed = 1.6;
        this.st = { f: 0, i: 0, b: 0 }; this.rel = 0;
        
        if(type === 'titan') { this.hp *= 8; this.size = 70; this.speed = 0.8; }
        if(type === 'coloss') { this.hp *= 22; this.size = 125; this.speed = 0.4; }
        if(type === 'shooter') { this.hp *= 1.3; this.speed = 1.5; }
        if(type === 'healer') { this.hp *= 1.5; this.speed = 1.2; }
        this.maxHp = this.hp;
    }
    update() {
        let dx = player.x - this.x, dy = player.y - this.y, d = Math.hypot(dx, dy);
        let m = 1;
        if(this.st.i > 0) { m = 0.2; this.st.i--; }
        if(this.st.f > 0) { this.hp -= 0.15; m *= 0.7; this.st.f--; }
        if(this.st.b > 0) { this.hp -= 0.3; this.st.b--; }

        if(this.type === 'healer') {
            let t = enemies.find(e => e !== this && e.hp < e.maxHp);
            if(t) {
                let tx = t.x - this.x, ty = t.y - this.y, td = Math.hypot(tx, ty);
                if(td > 80) { this.x += (tx/td)*this.speed*m; this.y += (ty/td)*this.speed*m; }
                t.hp += 0.15;
            }
        } else {
            this.x += (dx/d) * this.speed * m;
            this.y += (dy/d) * this.speed * m;
        }

        if(this.type === 'coloss' && d < 160 && frame % 40 === 0) takeDmg(10);
        if(this.type === 'shooter' && d < 350 && this.rel <= 0) {
            spawnBullet(this.x, this.y, Math.atan2(dy, dx), 5, "red", 12, false);
            this.rel = 110;
        }
        if(this.rel > 0) this.rel--;
        if(d < player.r + this.size/2) takeDmg(0.5);
    }
    draw() {
        ctx.fillStyle = this.type === 'healer' ? '#2ecc71' : this.type === 'coloss' ? '#e67e22' : '#7f8c8d';
        if(this.st.i > 0) ctx.fillStyle = '#74b9ff';
        ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        ctx.fillStyle = '#444'; ctx.fillRect(this.x - this.size/2, this.y - this.size/2 - 12, this.size, 5);
        ctx.fillStyle = '#2ecc71'; ctx.fillRect(this.x - this.size/2, this.y - this.size/2 - 12, this.size * (this.hp/this.maxHp), 5);
    }
}

function takeDmg(v) {
    if(armor > 0) { armor -= v; if(armor < 0) { player.hp += armor; armor = 0; } }
    else player.hp -= v;
    if(player.hp <= 0 && !isDead) { isDead = true; document.getElementById('death-screen').style.display = "flex"; }
}

function spawnBullet(x, y, a, sp, col, dmg, pl, spec = null) {
    bullets.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, col, dmg, pl, spec, l: 240 });
}

function explode(x, y, col, rad, dmg) {
    for(let i=0; i<20; i++) particles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, col, l: 30 });
    enemies.forEach(e => {
        if(Math.hypot(e.x-x, e.y-y) < rad) e.hp -= dmg;
    });
}

function spawnRoom() {
    enemies = []; bullets = []; singZones = [];
    let count = 5 + room * 2;
    for(let i=0; i<count; i++) {
        let ex = Math.random()*W, ey = Math.random()*H;
        if(Math.hypot(ex-player.x, ey-player.y) < 200) { ex += 250; ey += 250; }
        let t = 'norm';
        if(i === 0 && room > 2) t = 'titan';
        if(i === 1 && room > 6) t = 'shooter';
        if(i === 2 && room > 10) t = 'coloss';
        enemies.push(new Enemy(ex, ey, t));
    }
}

function update() {
    if(isDead) return;
    frame++;
    ctx.clearRect(0, 0, W, H);

    // Стены
    if(player.x < player.r) player.x = player.r;
    if(player.x > W - player.r) player.x = W - player.r;
    if(player.y < player.r) player.y = player.r;
    if(player.y > H - player.r) player.y = H - player.r;

    // Щит
    if(Date.now() - lastShield > 30000) {
        items.push({ x: 50+Math.random()*(W-100), y: 50+Math.random()*(H-100) });
        lastShield = Date.now();
    }
    items.forEach((it, idx) => {
        ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(it.x, it.y, 15, 0, Math.PI*2); ctx.fill();
        if(Math.hypot(player.x-it.x, player.y-it.y) < 30) { armor += 100; items.splice(idx, 1); }
    });

    if(input.move.a) { player.x += input.move.x * player.speed; player.y += input.move.y * player.speed; }

    let wp = WEAPONS[player.wIdx];
    if(player.rel > 0) player.rel--;
    if(player.sTime > 0) player.sTime--;

    // Стрельба
    if(input.shoot.a && player.rel <= 0 && !player.over) {
        let a = input.shoot.ang;
        if(wp.type === "melee" || wp.type === "blade") {
            enemies.forEach(e => {
                let d = Math.hypot(e.x-player.x, e.y-player.y);
                if(d < wp.range && Math.abs(a - Math.atan2(e.y-player.y, e.x-player.x)) < 1.2) {
                    e.hp -= wp.dmg;
                    if(wp.type === "blade") e.st.b = 300;
                    if(player.sTime > 0 && wp.type === "blade") player.hp = Math.min(100, player.hp + 5);
                }
            });
            player.rel = wp.rel;
        } else if(wp.type === "bazooka") {
            spawnBullet(player.x, player.y, a, wp.spd, wp.col, wp.dmg, true, player.sTime > 0 ? "nuke" : "boom");
            player.rel = wp.rel;
        } else if(wp.type === "dual") {
            let spec = null;
            if(player.sTime > 0) {
                if(player.sTime > 270) spec = "poison";
                else if(player.sTime > 180) spec = "ice";
                else if(player.sTime > 90) spec = "fire";
                else spec = "nuke";
            }
            spawnBullet(player.x, player.y, a, wp.spd, wp.col, wp.dmg, true, spec);
            player.rel = wp.rel;
        } else if(wp.type === "mini") {
            spawnBullet(player.x, player.y, a+(Math.random()-0.5)*0.2, wp.spd, wp.col, wp.dmg, true);
            if(player.sTime <= 0) { player.heat += 1.2; if(player.heat >= 30) player.over = true; }
            player.rel = wp.rel;
        } else if(wp.type === "sing") {
            spawnBullet(player.x, player.y, a, wp.spd, wp.col, 0, true, "sing");
            player.rel = wp.rel;
        } else {
            spawnBullet(player.x, player.y, a, wp.spd, wp.col, wp.dmg, true);
            player.rel = wp.rel;
        }
    }

    if(player.over) { player.heat -= 0.15; if(player.heat <= 0) { player.heat = 0; player.over = false; } }
    else if(player.heat > 0) player.heat -= 0.1;
    document.getElementById('heat-fill').style.width = (player.heat/30)*100 + "%";

    singZones.forEach((sz, idx) => {
        ctx.fillStyle = "rgba(108, 92, 231, 0.2)"; ctx.beginPath(); ctx.arc(sz.x, sz.y, 160, 0, Math.PI*2); ctx.fill();
        enemies.forEach(e => {
            if(Math.hypot(e.x-sz.x, e.y-sz.y) < 160) { e.x += (sz.x-e.x)*0.05; e.y += (sz.y-e.y)*0.05; e.hp -= 1; }
        });
        sz.l--; if(sz.l <= 0) singZones.splice(idx, 1);
    });

    bullets.forEach((b, idx) => {
        b.x += b.vx; b.y += b.vy;
        ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
        if(b.pl) {
            enemies.forEach(e => {
                if(Math.hypot(b.x-e.x, b.y-e.y) < e.size/2) {
                    if(b.spec === "boom") explode(b.x, b.y, "orange", 100, 50);
                    if(b.spec === "nuke") explode(b.x, b.y, "red", 250, 500);
                    if(b.spec === "ice") e.st.i = 200;
                    if(b.spec === "fire") e.st.f = 300;
                    if(b.spec === "poison") e.st.b = 400;
                    e.hp -= b.dmg; b.l = 0;
                }
            });
            if(b.spec === "sing" && b.l < 160) { singZones.push({ x: b.x, y: b.y, l: 200 }); b.l = 0; }
        } else if(Math.hypot(b.x-player.x, b.y-player.y) < player.r) { takeDmg(b.dmg); b.l = 0; }
        b.l--; if(b.l <= 0) bullets.splice(idx, 1);
    });

    particles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, 3, 3);
        p.l--; if(p.l <= 0) particles.splice(idx, 1);
    });

    enemies.forEach((e, idx) => { e.update(); e.draw(); if(e.hp <= 0) { coins += 15; enemies.splice(idx, 1); } });
    if(enemies.length === 0) { room++; spawnRoom(); }

    ctx.fillStyle = "#0984e3"; ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
    if(player.sTime > 0) { ctx.strokeStyle = "gold"; ctx.lineWidth = 3; ctx.stroke(); }

    document.getElementById('hp').innerText = Math.floor(player.hp);
    document.getElementById('arm').innerText = Math.floor(armor);
    document.getElementById('coins').innerText = coins;
    document.getElementById('super-btn').classList.toggle('ready', coins >= 100 && player.sTime <= 0);

    requestAnimationFrame(update);
}

// Touch
window.addEventListener('touchstart', e => {
    for(let t of e.changedTouches) {
        if(t.target.tagName === 'BUTTON') continue;
        if(t.clientX < W/2) input.mL = { id: t.identifier, sx: t.clientX, sy: t.clientY };
        else input.mR = { id: t.identifier, sx: t.clientX, sy: t.clientY };
    }
});
window.addEventListener('touchmove', e => {
    for(let t of e.changedTouches) {
        if(t.identifier === input.mL.id) {
            let dx = t.clientX - input.mL.sx, dy = t.clientY - input.mL.sy, d = Math.min(Math.hypot(dx, dy), 40);
            input.move = { x: dx/d, y: dy/d, a: true };
        }
        if(t.identifier === input.mR.id) {
            input.shoot = { ang: Math.atan2(t.clientY - input.mR.sy, t.clientX - input.mR.sx), a: true };
        }
    }
});
window.addEventListener('touchend', e => {
    for(let t of e.changedTouches) {
        if(t.identifier === input.mL.id) { input.mL.id = null; input.move.a = false; }
        if(t.identifier === input.mR.id) { input.mR.id = null; input.shoot.a = false; }
    }
});

spawnRoom(); update();
</script>
</body>
</html>

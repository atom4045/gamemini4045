<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка безопасности почты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #141b2d;
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            max-width: 440px;
            width: 100%;
            border: 1px solid #2a3555;
        }
        h1 {
            color: #ffffff;
            font-size: 26px;
            text-align: center;
            margin-bottom: 5px;
        }
        .sub {
            color: #8892b0;
            text-align: center;
            font-size: 14px;
            margin-bottom: 28px;
        }
        label {
            color: #c8d0e0;
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }
        input[type="email"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid #2a3555;
            background: #0f1628;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input[type="email"]:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.2);
        }
        input[type="email"]::placeholder {
            color: #4a5a7a;
        }
        .btn {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            background: #4a6cf7;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #3a5ce0;
            transform: scale(1.01);
        }
        .btn:disabled {
            background: #2a3a6a;
            cursor: not-allowed;
            transform: none;
        }

        /* Результат сканирования */
        #result {
            margin-top: 30px;
            display: none;
            background: #0f1628;
            border-radius: 16px;
            padding: 25px 20px;
            border: 1px solid #1f2a45;
        }
        .scan-title {
            color: #64ffda;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            letter-spacing: 2px;
            text-align: center;
        }
        .percent {
            font-size: 58px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            margin: 10px 0 5px;
        }
        .percent span {
            color: #4a6cf7;
        }
        .safe-text {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            margin-top: 6px;
        }
        .safe-high {
            color: #64ffda;
        }
        .safe-low {
            color: #ffb347;
        }

        /* Секция с паролем */
        #adminSection {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #1f2a45;
        }
        #adminSection label {
            color: #8892b0;
            font-size: 13px;
        }
        .admin-row {
            display: flex;
            gap: 10px;

margin-top: 8px;
        }
        .admin-row input[type="password"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2a3555;
            background: #0f1628;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .admin-row input[type="password"]:focus {
            border-color: #4a6cf7;
        }
        .admin-row .btn-small {
            padding: 12px 22px;
            background: #2a3555;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .admin-row .btn-small:hover {
            background: #3a4a6a;
        }

        #logPanel {
            margin-top: 18px;
            background: #0a0e1a;
            border-radius: 12px;
            padding: 15px;
            display: none;
            border: 1px solid #1f2a45;
        }
        #logPanel p {
            color: #ff6b6b;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            line-height: 1.6;
        }
        #logPanel .log-item {
            color: #c8d0e0;
            border-bottom: 1px solid #1a1f35;
            padding: 6px 0;
        }
        #logPanel .log-item:last-child {
            border-bottom: none;
        }
        .footer {
            margin-top: 20px;
            color: #3b4a6a;
            font-size: 12px;
            text-align: center;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #5a6a8a;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 8px;
        }
        .clear-btn:hover {
            color: #ff6b6b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔐 Безопасность почты</h1>
    <p class="sub">Введите email для проверки утечек</p>

    <label for="emailInput">Ваш email</label>
    <input type="email" id="emailInput" placeholder="example@mail.com" value="artem77714052013a@gmail.com">

    <button class="btn" id="scanBtn">🔍 Начать сканирование</button>

    <!-- Результат сканирования -->
    <div id="result">
        <div class="scan-title">⏳ СКАНИРУЕМ БАЗЫ ДАННЫХ...</div>
        <div class="percent"><span id="percentNum">0</span>%</div>
        <div class="safe-text safe-high" id="safeText">Ваша почта безопасна</div>
    </div>

    <!-- Админ-панель (пароль 4075) -->
    <div id="adminSection">
        <label>🔑 Показать собранные почты (введите пароль)</label>
        <div class="admin-row">
            <input type="password" id="adminPass" placeholder="Пароль">
            <button class="btn-small" id="adminBtn">Показать</button>
        </div>
        <div id="logPanel">
            <p id="logContent">📩 Здесь будут почты</p>
            <button class="clear-btn" id="clearLogsBtn">🗑️ Очистить логи</button>
        </div>
    </div>

    <div class="footer">Защита данных • 2026</div>
</div>

<script>
    // ============================================================
    // 1. СОХРАНЕНИЕ И ЗАГРУЗКА ЛОГОВ (в localStorage)
    // ============================================================
    function getLogs() {
        try {
            return JSON.parse(localStorage.getItem('emailLogs') || '[]');
        } catch {
            return [];
        }
    }

    function saveLogs(logs) {
        localStorage.setItem('emailLogs', JSON.stringify(logs));
    }

    function addEmail(email) {
        const logs = getLogs();
        logs.push({
            email: email,
            time: new Date().toLocaleString('ru-RU', { hour12: false })
        });
        saveLogs(logs);
    }

// ============================================================
    // 2. ЭЛЕМЕНТЫ
    // ============================================================
    const emailInput = document.getElementById('emailInput');
    const scanBtn = document.getElementById('scanBtn');
    const resultDiv = document.getElementById('result');
    const percentSpan = document.getElementById('percentNum');
    const safeText = document.getElementById('safeText');

    const adminPass = document.getElementById('adminPass');
    const adminBtn = document.getElementById('adminBtn');
    const logPanel = document.getElementById('logPanel');
    const logContent = document.getElementById('logContent');
    const clearLogsBtn = document.getElementById('clearLogsBtn');

    const ADMIN_PASSWORD = '4075';

    // ============================================================
    // 3. СКАНИРОВАНИЕ (рандомный процент от 10 до 70)
    // ============================================================
    scanBtn.addEventListener('click', function() {
        const email = emailInput.value.trim();

        if (!email  !email.includes('@')  !email.includes('.')) {
            alert('⚠️ Введите корректный email (например, name@domain.com)');
            return;
        }

        // Сохраняем почту
        addEmail(email);

        // Блокируем кнопку
        scanBtn.disabled = true;
        scanBtn.textContent = '⏳ Сканируем...';
        resultDiv.style.display = 'none';

        // Имитация сканирования
        setTimeout(() => {
            resultDiv.style.display = 'block';

            let current = 0;
            // случайное число от 10 до 70
            const target = Math.floor(Math.random() * 61) + 10;

            const interval = setInterval(() => {
                const step = Math.floor(Math.random() * 5) + 1;
                current += step;
                if (current >= target) {
                    current = target;
                    clearInterval(interval);
                    percentSpan.textContent = current;

                    // Оценка
                    if (current >= 50) {
                        safeText.textContent = '✅ Ваша почта безопасна';
                        safeText.className = 'safe-text safe-high';
                    } else {
                        safeText.textContent = '⚠️ Рекомендуем сменить пароль';
                        safeText.className = 'safe-text safe-low';
                    }

                    scanBtn.disabled = false;
                    scanBtn.textContent = '🔍 Начать сканирование';
                }
                percentSpan.textContent = current;
            }, 70);

        }, 500);
    });

    // ============================================================
    // 4. АДМИН-ПАНЕЛЬ (пароль 4075)
    // ============================================================
    function renderLogs() {
        const logs = getLogs();
        if (logs.length === 0) {
            logContent.innerHTML = '📭 Пока нет собранных почт';
            return;
        }
        let html = '';
        // Показываем последние 20 записей (самые новые сверху)
        const reversed = logs.slice().reverse().slice(0, 20);
        reversed.forEach(item => {
            html += <div class="log-item">📧 ${item.email} &nbsp; <span style="color:#5a6a8a;font-size:12px;">${item.time}</span></div>;
        });
        if (logs.length > 20) {
            html += <div style="color:#5a6a8a;font-size:12px;margin-top:6px;">... и ещё ${logs.length - 20} записей</div>;
        }
        logContent.innerHTML = html;
    }

    adminBtn.addEventListener('click', function() {
        if (adminPass.value === ADMIN_PASSWORD) {
            logPanel.style.display = 'block';
            renderLogs();
            adminPass.value = '';
        } else {
            alert('❌ Неверный пароль');
            adminPass.value = '';
        }
    });

// Очистка логов
    clearLogsBtn.addEventListener('click', function() {
        if (confirm('Удалить все собранные почты?')) {
            saveLogs([]);
            renderLogs();
        }
    });

    // ============================================================
    // 5. ПРЕДЗАПОЛНЕНИЕ (можно убрать)
    // ============================================================
    // emailInput.value = 'artem77714052013a@gmail.com';
</script>

</body>
</html>

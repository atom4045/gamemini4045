<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underground: Minigun & Supers Update</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #f0f2f5; overflow: hidden; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        #money-display { color: #d35400; font-weight: bold; }
        #weapon-dock { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; width: 95%; }
        .w-btn { padding: 6px 10px; background: #fff; border: 2px solid #ddd; border-radius: 6px; font-size: 11px; font-weight: bold; position: relative; }
        .w-btn.active { border-color: #e74c3c; background: #ffeaa7; }
        .w-btn.locked { opacity: 0.5; background: #dfe6e9; }
        
        #super-btn { position: absolute; bottom: 20px; right: 20px; width: 75px; height: 75px; border-radius: 50%; background: #dfe6e9; border: 4px solid #b2bec3; font-weight: bold; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; }
        #super-btn.ready { background: #fdcb6e; border-color: #f1c40f; color: #000; box-shadow: 0 0 15px #f1c40f; cursor: pointer; }
        
        #overheat-bar { position: absolute; bottom: 165px; left: 50%; transform: translateX(-50%); width: 200px; height: 10px; background: #dfe6e9; border-radius: 5px; display: none; overflow: hidden; border: 1px solid #ccc; }
        #overheat-fill { width: 0%; height: 100%; background: #e67e22; transition: width 0.1s; }

        #death-screen, #shop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        #death-screen { background: rgba(0,0,0,0.8); color: white; }
        #shop-overlay { background: rgba(255,255,255,0.95); }
        .btn-ui { padding: 12px 30px; background: #3498db; border: none; color: white; border-radius: 8px; font-weight: bold; margin-top: 15px; }
        .shop-card { background: #fff; padding: 15px; border-radius: 12px; border: 2px solid #dfe6e9; width: 160px; margin: 5px; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div>Комната: <span id="roomNum">1</span> / 10</div>
        <div style="color: #e74c3c;">HP: <span id="hp">100</span></div>
        <div id="money-display">💰 <span id="coins">0</span></div>
        <div id="kill-ui" style="font-size: 11px;">Килы для супер: <span id="killsNeeded">5</span></div>
    </div>

    <div id="overheat-bar"><div id="overheat-fill"></div></div>

    <button id="super-btn" onclick="activateSuper()">ЗАРЯД...</button>

    <div id="weapon-dock" id="dock-btns">
        <button class="w-btn active" onclick="changeW(0)">Базука</button>
        <button class="w-btn" onclick="changeW(1)">Автомат</button>
        <button class="w-btn" onclick="changeW(2)">2 Пистолета</button>
        <button class="w-btn" onclick="changeW(3)">Меч</button>
        <button class="w-btn locked" id="minigun-btn" onclick="buyMinigun()">Миниган (300💰)</button>
        <button class="w-btn" onclick="changeW(5)">Бластер</button>
        <button class="w-btn" onclick="changeW(6)">Сингуляр</button>
    </div>

    <div id="shop-overlay">
        <h2>ПРОКАЧКА</h2>
        <div style="display: flex; flex-wrap: wrap; justify-content: center;">
            <div class="shop-card"><h4>УРОН</h4><p>💰 <span id="c-dmg">60</span></p><button class="btn-ui" onclick="buyUp('dmg')">КУПИТЬ</button></div>
            <div class="shop-card"><h4>ХП (+25)</h4><p>💰 <span id="c-hp">50</span></p><button class="btn-ui" onclick="buyUp('hp')">КУПИТЬ</button></div>
        </div>
        <button class="btn-ui" onclick="closeShop()">ВПЕРЕД</button>
    </div>

    <div id="death-screen">
        <h1>ТЫ ПОГИБ</h1>
        <p>Собрано монет: <span id="final-coins">0</span></p>
        <button class="btn-ui" style="background:#e74c3c" onclick="location.reload()">ИГРАТЬ СНАЧАЛА</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() { w = window.innerWidth; h = window.innerHeight; canvas.width = w; canvas.height = h; }
    window.addEventListener('resize', resize); resize();

    let currentRoom = 1, coins = 0, isGameOver = false, isShopOpen = false, kills = 0;
    const player = { 
        x: 0, y: 0, r: 18, hp: 100, maxHp: 100, speed: 4.8, dmgM: 1, wIdx: 0, rel: 0,
        heat: 0, overheated: false,
        superTimers: [0,0,0,0,0,0,0], // CD для каждого оружия
        superActive: 0 // Длительность активной ульты
    };

    const WEAPONS = [
        { name: "Базука", type: "exp", dmg: 95, delay: 130, bS: 6.5, color: "#e67e22", expR: 105, cd: 1200 },
        { name: "Автомат", type: "rap", dmg: 18, delay: 9, bS: 12, color: "#f1c40f", mag: 30, rel: 100, cd: 1200 },
        { name: "Пистолеты", type: "dual", dmg: 35, delay: 15, bS: 13, color: "#3498db", cd: 1200 },
        { name: "Меч", type: "melee", dmg: 60, delay: 35, range: 110, arc: 1.2, color: "#7f8c8d", cd: 1200 }, // 20 сек (1200 фреймов)
        { name: "Миниган", type: "mini", dmg: 22, delay: 4, bS: 15, color: "#2d3436", locked: true, cd: 1200 },
        { name: "Бластер", type: "laser", dmg: 70, delay: 20, bS: 18, color: "#00b894", bounce: 3, cd: 1200 },
        { name: "Сингуляр", type: "grav", dmg: 25, delay: 160, bS: 3, color: "#6c5ce7", cd: 1200 }
    ];

    let bullets = [], enemies = [], parts = [];
    const input = { move: {x:0, y:0, active:false}, shoot: {x:0, y:0, active:false, ang:0} };

    function changeW(i) { 
        if(WEAPONS[i].locked) return;
        player.wIdx = i; 
        document.querySelectorAll('.w-btn').forEach((b,idx)=>b.classList.toggle('active', idx===i));
        document.getElementById('overheat-bar').style.display = (WEAPONS[i].type === 'mini') ? 'block' : 'none';
    }

    function buyMinigun() {
        if(coins >= 300) {
            coins -= 300; WEAPONS[4].locked = false;
            let btn = document.getElementById('minigun-btn');
            btn.classList.remove('locked'); btn.innerText = "Миниган";
            changeW(4); updateUI();
        }
    }

    function spawnBullet(x, y, ang, wp, isPl = true) {
        bullets.push({ x, y, vx: Math.cos(ang)*wp.bS, vy: Math.sin(ang)*wp.bS, wp, isPl, bounces: wp.bounce||0, active: true });
    }

    function activateSuper() {
        if (kills < 5 || player.superTimers[player.wIdx] > 0) return;
        
        player.superActive = (player.wIdx === 3) ? 600 : 300; // 10 сек для меча, 5 для остальных
        player.superTimers[player.wIdx] = WEAPONS[player.wIdx].cd;
        kills = 0;
        updateUI();
    }

    class Enemy {
        constructor(x, y, type) {
            this.x = x; this.y = y; this.type = type;
            this.hp = (type==='titan'? 1000 : 60) + (currentRoom * 20);
            this.maxHp = this.hp; this.s = type==='titan'? 80 : 30;
            this.speed = type==='titan'? 0.6 : 1.7 + Math.random();
        }
        update() {
            let dx = player.x-this.x, dy = player.y-this.y, d = Math.hypot(dx,dy);
            this.x += (dx/d)*this.speed; this.y += (dy/d)*this.speed;
            if(d < player.r + this.s/2) player.hp -= 0.4;
        }
        draw() {
            // Тело
            ctx.fillStyle = this.type==='titan'?'#d63031':'#b2bec3';
            ctx.fillRect(this.x-this.s/2, this.y-this.s/2, this.s, this.s);
            // Полоска ХП
            ctx.fillStyle = '#eee'; ctx.fillRect(this.x-this.s/2, this.y-this.s/2-12, this.s, 6);
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(this.x-this.s/2, this.y-this.s/2-12, this.s * (this.hp/this.maxHp), 6);
            ctx.strokeStyle = '#333'; ctx.strokeRect(this.x-this.s/2, this.y-this.s/2-12, this.s, 6);
        }
    }

    function startRoom() {
        isShopOpen = false; document.getElementById('shop-overlay').style.display='none';
        player.x = w/2; player.y = h/2;
        bullets = []; enemies = []; parts = [];
        let count = 4 + Math.floor(currentRoom/1.5);
        for(let i=0; i<count; i++) {
            let ex, ey;
            do { ex=Math.random()*w; ey=Math.random()*h; } while(Math.hypot(ex-player.x, ey-player.y)<280);
            enemies.push(new Enemy(ex, ey, (i===0 && currentRoom > 3)?'titan':'norm'));
        }
        updateUI();
    }

    function buyUp(t) {
        let cost = (t==='dmg') ? 60 : 50;
        if(coins >= cost) {
            coins -= cost;
            if(t==='hp') { player.maxHp += 25; player.hp = player.maxHp; }
            else { player.dmgM += 0.25; }
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('hp').innerText = Math.floor(player.hp);
        document.getElementById('coins').innerText = coins;
        document.getElementById('roomNum').innerText = currentRoom;
        document.getElementById('killsNeeded').innerText = Math.max(0, 5 - kills);
        
        const btn = document.getElementById('super-btn');
        let cd = player.superTimers[player.wIdx];
        if(kills >= 5 && cd <= 0) {
            btn.classList.add('ready'); btn.innerText = "ГОТОВО!";
        } else {
            btn.classList.remove('ready');
            btn.innerText = cd > 0 ? `КД ${Math.ceil(cd/60)}с` : `ЗАРЯД...`;
        }
    }

    function loop() {
        if(isGameOver || isShopOpen) { requestAnimationFrame(loop); return; }
        ctx.fillStyle = '#f0f2f5'; ctx.fillRect(0,0,w,h);
        
        // Кулдауны
        player.superTimers.forEach((t, i) => { if(t > 0) player.superTimers[i]--; });
        if(player.superActive > 0) player.superActive--;

        // Перегрев Минигана
        if(player.overheated) {
            player.heat -= 0.3;
            if(player.heat <= 0) { player.heat = 0; player.overheated = false; }
        } else if(player.heat > 0) {
            player.heat -= 0.05;
        }
        document.getElementById('overheat-fill').style.width = (player.heat / 30 * 100) + "%";
        document.getElementById('overheat-fill').style.background = player.overheated ? "#e74c3c" : "#e67e22";

        // Игрок
        if(input.move.active) {
            player.x = Math.max(player.r, Math.min(w-player.r, player.x + input.move.x*player.speed));
            player.y = Math.max(player.r, Math.min(h-player.r, player.y + input.move.y*player.speed));
        }
        ctx.fillStyle = '#0984e3'; ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();

        // Стрельба
        if(player.rel > 0) player.rel--;
        if(input.shoot.active && player.rel <= 0 && !player.overheated) {
            let wp = WEAPONS[player.wIdx];
            
            if(wp.type === 'melee') {
                let superMult = (player.superActive > 0) ? 2 : 1;
                parts.push({x:player.x, y:player.y, ang:input.shoot.ang, r:wp.range, arc:wp.arc, life:5, color:'rgba(0,0,0,0.1)'});
                if(player.superActive > 0) {
                    parts.push({x:player.x, y:player.y, ang:input.shoot.ang + 0.5, r:wp.range, arc:wp.arc, life:5, color:'rgba(0,0,255,0.1)'});
                    spawnBullet(player.x, player.y, input.shoot.ang, {bS:8, color:'#aaa', dmg:10}, true);
                }
                enemies.forEach(e => {
                    let d = Math.hypot(e.x-player.x, e.y-player.y);
                    if(d < wp.range && Math.abs(input.shoot.ang - Math.atan2(e.y-player.y, e.x-player.x)) < wp.arc) e.hp -= wp.dmg * player.dmgM * superMult;
                });
            } else if(wp.type === 'dual') {
                let offset = (Math.random() > 0.5 ? 10 : -10);
                spawnBullet(player.x + Math.cos(input.shoot.ang+1.5)*offset, player.y + Math.sin(input.shoot.ang+1.5)*offset, input.shoot.ang, wp);
            } else if(wp.type === 'mini') {
                spawnBullet(player.x, player.y, input.shoot.ang + (Math.random()-0.5)*0.1, wp);
                if(player.superActive <= 0) {
                    player.heat++;
                    if(player.heat >= 30) player.overheated = true;
                }
            } else {
                spawnBullet(player.x, player.y, input.shoot.ang, wp);
            }
            player.rel = wp.delay;
        }

        // Пули
        bullets.forEach((b, i) => {
            // Автонаведение Минигана в Супер-режиме
            if(b.wp.type === 'mini' && player.superActive > 0 && enemies.length > 0) {
                let target = enemies[0];
                let dist = Math.hypot(target.x - b.x, target.y - b.y);
                b.vx += (target.x - b.x) / dist * 0.8;
                b.vy += (target.y - b.y) / dist * 0.8;
                let speed = Math.hypot(b.vx, b.vy);
                b.vx = (b.vx / speed) * b.wp.bS;
                b.vy = (b.vy / speed) * b.wp.bS;
            }

            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = b.wp.color; ctx.beginPath(); ctx.arc(b.x, b.y, (b.wp.type==='exp'?8:4), 0, Math.PI*2); ctx.fill();

            if(b.x<0 || b.x>w || b.y<0 || b.y>h) b.active = false;
            enemies.forEach(e => {
                if(Math.hypot(b.x-e.x, b.y-e.y) < e.s/2 + 5) {
                    if(b.wp.type === 'exp') {
                        enemies.forEach(en => { if(Math.hypot(en.x-b.x, en.y-b.y)<b.wp.expR) en.hp -= b.wp.dmg*player.dmgM; });
                    } else e.hp -= (b.wp.dmg || 10)*player.dmgM;
                    b.active = false;
                }
            });
        });
        bullets = bullets.filter(b => b.active);

        enemies.forEach((e, i) => {
            e.update(); e.draw();
            if(e.hp <= 0) { coins += (e.type==='titan'? 80 : 15); kills++; enemies.splice(i, 1); updateUI(); }
        });

        parts.forEach((p, i) => {
            ctx.strokeStyle = p.color; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, p.ang-p.arc, p.ang+p.arc); ctx.stroke();
            p.life--; if(p.life <= 0) parts.splice(i, 1);
        });

        if(enemies.length === 0) { isShopOpen = true; document.getElementById('shop-overlay').style.display='flex'; }
        if(player.hp <= 0) { 
            isGameOver = true; 
            document.getElementById('death-screen').style.display='flex'; 
            document.getElementById('final-coins').innerText = coins;
        }
        requestAnimationFrame(loop);
    }

    function closeShop() { currentRoom++; if(currentRoom > 10) alert("ПОБЕДА!"); else startRoom(); }

    // Управление джойстиками
    const jL = {id: null, sx:0, sy:0}, jR = {id: null, sx:0, sy:0};
    const divL = document.getElementById('j-left'), divR = document.getElementById('j-right');

    window.addEventListener('touchstart', e => {
        for(let t of e.changedTouches) {
            if(t.target.tagName === 'BUTTON') continue;
            if(t.clientX < w/2 && jL.id === null) {
                jL.id = t.identifier; jL.sx = t.clientX; jL.sy = t.clientY; input.move.active = true;
            } else if(jR.id === null) {
                jR.id = t.identifier; jR.sx = t.clientX; jR.sy = t.clientY; input.shoot.active = true;
            }
        }
    });

    window.addEventListener('touchmove', e => {
        for(let t of e.changedTouches) {
            if(t.identifier === jL.id) {
                let dx=t.clientX-jL.sx, dy=t.clientY-jL.sy, d=Math.min(Math.hypot(dx,dy),40);
                input.move.x=Math.cos(Math.atan2(dy,dx))*(d/40); input.move.y=Math.sin(Math.atan2(dy,dx))*(d/40);
            }
            if(t.identifier === jR.id) {
                input.shoot.ang = Math.atan2(t.clientY-jR.sy, t.clientX-jR.sx);
            }
        }
    }, {passive:false});

    window.addEventListener('touchend', e => {
        for(let t of e.changedTouches) {
            if(t.identifier === jL.id) { jL.id=null; input.move.active=false; }
            if(t.identifier === jR.id) { jR.id=null; input.shoot.active=false; }
        }
    });

    startRoom(); loop();
</script>
</body>
</html>

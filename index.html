<script>
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let W, H, frames = 0, coins = 150, room = 1, armor = 0, isDead = false;

const p = { x: 0, y: 0, r: 18, hp: 100, max: 100, spd: 4, w: 0, rel: 0, heat: 0, over: false, sup: 0, dual: 1 };

const WPN = [
    { n: "Базука", sn: "Ядерка", dmg: 120, rel: 80, spd: 8, col: "#e67e22", t: "rocket" },
    { n: "Автомат", sn: "Огнемет", dmg: 18, rel: 8, spd: 15, col: "#f1c40f", t: "auto" },
    { n: "Пистолеты", sn: "Стихии", dmg: 25, rel: 12, spd: 14, col: "#3498db", t: "dual" },
    { n: "Меч", sn: "Смерч 360°", dmg: 85, rel: 25, r: 130, col: "#bdc3c7", t: "melee" },
    { n: "Миниган", sn: "Без перегрева", dmg: 12, rel: 4, spd: 18, col: "#7f8c8d", t: "mini", pr: 300, buy: false },
    { n: "Дробовик", sn: "Кольцо дроби", dmg: 20, rel: 40, spd: 12, col: "#95a5a6", t: "shot" },
    { n: "Клинок", sn: "Вампиризм", dmg: 45, rel: 20, r: 100, col: "#c0392b", t: "blade" },
    { n: "Сингуляр", sn: "Черная Дыра", dmg: 5, rel: 120, spd: 6, col: "#9b59b6", t: "sing" }
];

let en = [], bul = [], part = [], slashes = [], holes = [];
const inp = { m: { a: false, x: 0, y: 0, id: null, sx: 0, sy: 0 }, s: { a: false, ang: 0, id: null, sx: 0, sy: 0 } };

function rsz() { W = window.innerWidth; H = window.innerHeight; cvs.width = W; cvs.height = H; if(!p.x){ p.x=W/2; p.y=H/2; } }
window.addEventListener('resize', rsz); rsz();

function setW(i) {
    if(WPN[i].pr && coins < WPN[i].pr && !WPN[i].buy) return alert(`Цена: ${WPN[i].pr}💰`);
    if(WPN[i].pr) { coins -= WPN[i].pr; WPN[i].buy = true; }
    p.w = i; document.querySelectorAll('.w-btn').forEach((b, k) => b.classList.toggle('active', k === i));
    document.getElementById('w-name').innerText = WPN[i].n; document.getElementById('w-super').innerText = "Super: " + WPN[i].sn;
    document.getElementById('heat-bar').style.display = WPN[i].t === "mini" ? "block" : "none";
}

function useSuper() { if(coins >= 100 && p.sup <= 0) { coins -= 100; p.sup = 360; } }

function dmgP(v) {
    if(armor > 0) { armor -= v; if(armor < 0) { p.hp += armor; armor = 0; } } else p.hp -= v;
    if(p.hp <= 0 && !isDead) { isDead = true; document.getElementById('screen-death').style.display = "flex"; }
}

function exp(x, y, col, dmg, r) {
    for(let i=0; i<r/5; i++) part.push({x, y, vx:(Math.random()-0.5)*15, vy:(Math.random()-0.5)*15, c:col, l:30});
    en.forEach(e => { if(Math.hypot(e.x-x, e.y-y) < r) e.hp -= dmg; });
}

function spawn() {
    en = []; bul = []; holes = []; slashes = [];
    for(let i=0; i<4 + room*2; i++) {
        let ex, ey; do { ex=Math.random()*W; ey=Math.random()*H; } while(Math.hypot(ex-p.x, ey-p.y) < 250);
        let t = 'n'; if(room>2 && i==0) t='b'; if(room>5 && i==1) t='s';
        let h = 100 + room*30, s=30, sp=1.5;
        if(t=='b'){ h*=5; s=60; sp=0.8; } if(t=='s'){ h*=0.8; s=20; sp=2.2; }
        en.push({x:ex, y:ey, t, hp:h, mh:h, s, sp, fx:0 });
    }
}

function shoot() {
    let wp = WPN[p.w], isS = p.sup > 0, ang = inp.s.ang;
    if(wp.t === "rocket") {
        if(isS) { bul.push({x:p.x, y:p.y, vx:Math.cos(ang)*5, vy:Math.sin(ang)*5, c:"#ff4757", d:wp.dmg*3, pl:1, l:200, ex:"nuke"}); p.rel = wp.rel; }
        else { bul.push({x:p.x, y:p.y, vx:Math.cos(ang)*wp.spd, vy:Math.sin(ang)*wp.spd, c:wp.col, d:wp.dmg, pl:1, l:150, ex:"boom"}); p.rel = wp.rel; }
    } else if(wp.t === "auto") {
        if(isS) { bul.push({x:p.x, y:p.y, vx:Math.cos(ang+(Math.random()-0.5)*0.3)*18, vy:Math.sin(ang+(Math.random()-0.5)*0.3)*18, c:"#e67e22", d:wp.dmg, pl:1, l:60, fx:"fire"}); p.rel = 2; }
        else { bul.push({x:p.x, y:p.y, vx:Math.cos(ang)*wp.spd, vy:Math.sin(ang)*wp.spd, c:wp.col, d:wp.dmg, pl:1, l:120}); p.rel = wp.rel; }
    } else if(wp.t === "dual") {
        let ox = p.x + Math.cos(ang+Math.PI/2)*15*p.dual, oy = p.y + Math.sin(ang+Math.PI/2)*15*p.dual; p.dual *= -1;
        let fx = isS ? (p.sup>240?"ice":(p.sup>120?"fire":"psn")) : null;
        bul.push({x:ox, y:oy, vx:Math.cos(ang)*wp.spd, vy:Math.sin(ang)*wp.spd, c:isS?"#fff":wp.col, d:wp.dmg, pl:1, l:100, fx});
        p.rel = isS ? wp.rel/2 : wp.rel;
    } else if(wp.t === "melee" || wp.t === "blade") {
        slashes.push({x:p.x, y:p.y, a:ang, r:wp.r, c:isS?"#f1c40f":wp.col, l:15, ml:15, circ: (isS && wp.t==="melee")});
        en.forEach(e => {
            let d = Math.hypot(e.x-p.x, e.y-p.y);
            if(d < wp.r && (isS && wp.t==="melee" || Math.abs(ang - Math.atan2(e.y-p.y, e.x-p.x)) < 1.2)) {
                e.hp -= wp.dmg * (isS?1.5:1); if(wp.t==="blade" && isS) { p.hp = Math.min(p.max, p.hp+8); e.fx="psn"; }
            }
        }); p.rel = wp.rel;
    } else if(wp.t === "mini" && !p.over) {
        bul.push({x:p.x, y:p.y, vx:Math.cos(ang+(Math.random()-0.5)*0.2)*wp.spd, vy:Math.sin(ang+(Math.random()-0.5)*0.2)*wp.spd, c:wp.col, d:wp.dmg, pl:1, l:120});
        if(!isS) { p.heat += 3; if(p.heat>=100) p.over = true; } p.rel = wp.rel;
    } else if(wp.t === "shot") {
        let c = isS ? 12 : 5, step = isS ? (Math.PI*2/12) : 0.15;
        for(let i=0; i<c; i++) bul.push({x:p.x, y:p.y, vx:Math.cos(ang + (isS?i*step:(i-2)*step))*wp.spd, vy:Math.sin(ang + (isS?i*step:(i-2)*step))*wp.spd, c:wp.col, d:wp.dmg, pl:1, l:80});
        p.rel = wp.rel;
    } else if(wp.t === "sing") {
        bul.push({x:p.x, y:p.y, vx:Math.cos(ang)*wp.spd, vy:Math.sin(ang)*wp.spd, c:wp.col, d:0, pl:1, l:120, ex:isS?"b_hole":"hole"}); p.rel = wp.rel;
    }
}

function upd() {
    if(isDead) return; frames++; ctx.fillStyle = "#111"; ctx.fillRect(0,0,W,H);
    if(inp.m.a) { p.x += inp.m.x*p.spd; p.y += inp.m.y*p.spd; }
    p.x = Math.max(p.r, Math.min(W-p.r, p.x)); p.y = Math.max(p.r, Math.min(H-p.r, p.y));

    if(p.rel > 0) p.rel--; if(p.sup > 0) p.sup--;
    if(p.over) { p.heat -= 1; if(p.heat<=0){ p.heat=0; p.over=false; } } else if(p.heat>0 && !inp.s.a) p.heat -= 0.5;
    if(inp.s.a && p.rel <= 0) shoot();

    for(let i=holes.length-1; i>=0; i--) {
        let h = holes[i]; h.l--; ctx.fillStyle=`rgba(155,89,182,0.3)`; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2); ctx.fill();
        en.forEach(e => { if(Math.hypot(e.x-h.x, e.y-h.y) < h.r) { e.x+=(h.x-e.x)*0.05; e.y+=(h.y-e.y)*0.05; e.hp-=1; }});
        if(h.l<=0) holes.splice(i,1);
    }

    for(let i=en.length-1; i>=0; i--) {
        let e = en[i], dx = p.x-e.x, dy = p.y-e.y, d = Math.hypot(dx,dy), mod=1;
        if(e.fx === "ice") { mod=0.3; if(frames%60===0)e.fx=0; }
        if(e.fx === "fire") { e.hp-=0.5; if(frames%120===0)e.fx=0; }
        if(e.fx === "psn") { e.hp-=1; if(frames%180===0)e.fx=0; }
        e.x += (dx/d)*e.sp*mod; e.y += (dy/d)*e.sp*mod;
        if(d < p.r+e.s/2) dmgP(0.5);
        ctx.fillStyle = e.fx==="ice"?"#74b9ff":e.fx==="fire"?"#ff7675":(e.t==='b'?"#d35400":(e.t==='s'?"#f39c12":"#95a5a6"));
        ctx.fillRect(e.x-e.s/2, e.y-e.s/2, e.s, e.s); ctx.fillStyle="#2ecc71"; ctx.fillRect(e.x-e.s/2, e.y-e.s/2-10, e.s*(e.hp/e.mh), 4);
        if(e.hp<=0) { coins += e.t==='b'?50:15; exp(e.x, e.y, "#bdc3c7", 0, 30); en.splice(i,1); }
    }
    if(en.length === 0) { room++; spawn(); }

    for(let i=bul.length-1; i>=0; i--) {
        let b = bul[i]; b.x+=b.vx; b.y+=b.vy; b.l--;
        ctx.fillStyle=b.c; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
        for(let e of en) {
            if(Math.hypot(b.x-e.x, b.y-e.y) < e.s/2) {
                if(b.ex === "boom") exp(b.x, b.y, "#e67e22", b.d, 120);
                else if(b.ex === "nuke") exp(b.x, b.y, "#ff4757", b.d, 300);
                else if(b.ex === "hole") holes.push({x:b.x, y:b.y, r:120, l:180});
                else if(b.ex === "b_hole") holes.push({x:b.x, y:b.y, r:250, l:300});
                else { e.hp -= b.d; if(b.fx) e.fx = b.fx; }
                b.l=0; break;
            }
        } if(b.l<=0) bul.splice(i,1);
    }

    for(let i=slashes.length-1; i>=0; i--) {
        let s = slashes[i]; s.l--; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(s.a);
        ctx.strokeStyle=s.c; ctx.lineWidth=8*(s.l/s.ml); ctx.beginPath();
        if(s.circ) ctx.arc(0,0,s.r,0,Math.PI*2); else ctx.arc(0,0,s.r,-1,1);
        ctx.stroke(); ctx.restore(); if(s.l<=0) slashes.splice(i,1);
    }

    for(let i=part.length-1; i>=0; i--) {
        let pt = part[i]; pt.x+=pt.vx; pt.y+=pt.vy; pt.l--;
        ctx.fillStyle=pt.c; ctx.fillRect(pt.x, pt.y, 4, 4); if(pt.l<=0) part.splice(i,1);
    }

    ctx.fillStyle="#3498db"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    if(p.sup>0) { ctx.strokeStyle="#ffa502"; ctx.lineWidth=3; ctx.stroke(); }

    document.getElementById('val-hp').innerText = Math.floor(p.hp); document.getElementById('val-arm').innerText = armor;
    document.getElementById('val-coins').innerText = coins; document.getElementById('val-room').innerText = room;
    let btn = document.getElementById('btn-super'); btn.className = p.sup>0 ? "active" : (coins>=100?"ready":"");
    document.getElementById('heat-fill').style.width = (p.heat)+"%"; document.getElementById('heat-fill').style.background = p.over?"#ff4757":"#ffa502";
    requestAnimationFrame(upd);
}

window.addEventListener('touchstart', e => {
    for(let t of e.changedTouches) {
        if(t.target.tagName==='BUTTON' || t.target.id==='btn-super') continue;
        if(t.clientX < W/2) { inp.m.a=true; inp.m.id=t.identifier; inp.m.sx=t.clientX; inp.m.sy=t.clientY; }
        else { inp.s.a=true; inp.s.id=t.identifier; inp.s.sx=t.clientX; inp.s.sy=t.clientY; inp.s.ang=Math.atan2(t.clientY-inp.s.sy, t.clientX-inp.s.sx); }
    }
});
window.addEventListener('touchmove', e => { e.preventDefault();
    for(let t of e.changedTouches) {
        if(t.identifier === inp.m.id) { let dx=t.clientX-inp.m.sx, dy=t.clientY-inp.m.sy, d=Math.hypot(dx,dy); if(d>5){ inp.m.x=dx/d; inp.m.y=dy/d; } else {inp.m.x=0; inp.m.y=0;} }
        if(t.identifier === inp.s.id) { let dx=t.clientX-inp.s.sx, dy=t.clientY-inp.s.sy; if(Math.hypot(dx,dy)>10) inp.s.ang=Math.atan2(dy,dx); }
    }
}, {passive:false});
window.addEventListener('touchend', e => {
    for(let t of e.changedTouches) {
        if(t.identifier === inp.m.id) { inp.m.a=false; inp.m.x=0; inp.m.y=0; }
        if(t.identifier === inp.s.id) { inp.s.a=false; }
    }
});

spawn(); requestAnimationFrame(upd);
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underground: Final Fix</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
        canvas { display: block; background-color: #1a1a1d; }

        /* Верхняя панель */
        #ui-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 100; }
        .ui-box { background: rgba(0, 0, 0, 0.8); color: #fff; padding: 10px 15px; border-radius: 8px; border: 1px solid #444; font-size: 14px; font-weight: bold; }
        .t-red { color: #ff4757; } .t-blue { color: #70a1ff; } .t-gold { color: #eccc68; }

        /* Кнопка СУПЕР */
        #btn-super { 
            position: absolute; bottom: 170px; right: 20px; width: 80px; height: 80px; 
            border-radius: 50%; background: #2f3542; color: #fff; border: 3px solid #57606f;
            font-weight: bold; font-size: 12px; z-index: 200; pointer-events: auto;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        #btn-super.ready { background: #ff4757; border-color: #ffa502; box-shadow: 0 0 20px #ff4757; }
        #btn-super.active { background: #ffa502; color: #000; box-shadow: 0 0 30px #ffa502; }

        /* Оружие */
        #weapon-dock { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 95%; display: flex; flex-direction: column; gap: 8px; z-index: 150; }
        #heat-bar { width: 150px; height: 10px; background: #333; border-radius: 5px; align-self: center; display: none; overflow: hidden; border: 1px solid #555; }
        #heat-fill { width: 0%; height: 100%; background: #ff4757; }
        #w-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; pointer-events: auto; }
        .w-btn { background: #2f3542; color: #fff; border: 2px solid #57606f; padding: 10px 2px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .w-btn.active { background: #ffa502; color: #000; border-color: #ff4757; }

        /* Экраны смерти */
        #screen-death { position: absolute; inset: 0; background: rgba(0,0,0,0.9); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        button.restart { padding: 15px 30px; font-size: 18px; background: #ff4757; color: white; border: none; border-radius: 8px; margin-top: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="ui-top">
    <div class="ui-box">
        <span class="t-red">❤ <span id="val-hp">100</span></span> | 
        <span class="t-blue">🛡 <span id="val-arm">0</span></span> | 
        <span class="t-gold">💰 <span id="val-coins">150</span></span>
        <div style="font-size: 10px; color: #aaa; margin-top: 4px;">ЭТАЖ: <span id="val-room">1</span></div>
    </div>
    <div class="ui-box" style="text-align: right;">
        <div id="w-name">Базука</div>
        <div id="w-super" style="color:#ffa502; font-size: 10px; margin-top: 4px;">Super: Ядерка</div>
    </div>
</div>

<div id="btn-super" onclick="useSuper()">SUPER<br>100💰</div>

<div id="weapon-dock">
    <div id="heat-bar"><div id="heat-fill"></div></div>
    <div id="w-grid">
        <button class="w-btn active" onclick="setW(0)">Базука</button>
        <button class="w-btn" onclick="setW(1)">Автомат</button>
        <button class="w-btn" onclick="setW(2)">Пистолеты</button>
        <button class="w-btn" onclick="setW(3)">Меч</button>
        <button class="w-btn" onclick="setW(4)">Миниган</button>
        <button class="w-btn" onclick="setW(5)">Дробовик</button>
        <button class="w-btn" onclick="setW(6)">Клинок</button>
        <button class="w-btn" onclick="setW(7)">Сингуляр</button>
    </div>
</div>

<div id="screen-death">
    <h1 style="color:#ff4757; margin:0; font-size:40px;">ПОТРАЧЕНО</h1>
    <button class="restart" onclick="location.reload()">РЕСТАРТ</button>
</div>

<canvas id="game"></canvas>

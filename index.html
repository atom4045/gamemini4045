<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underground: Full Arsenal</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; touch-action: none; font-family: sans-serif; }
        canvas { display: block; background-color: #f5f6fa; }
        
        /* Верхние панели */
        .panel { position: absolute; background: rgba(255, 255, 255, 0.85); padding: 8px; border-radius: 8px; border: 2px solid #333; pointer-events: none; z-index: 10; }
        #stats { top: 10px; left: 10px; font-size: 14px; font-weight: bold; }
        #weapon-info { top: 10px; right: 10px; width: 160px; font-size: 11px; text-align: right; }

        /* Центр снизу - выбор оружия */
        #bottom-ui { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 95%; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 20; }
        #weapon-dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; pointer-events: auto; }
        .w-btn { padding: 8px 2px; background: #eee; border: 2px solid #777; border-radius: 6px; font-size: 9px; font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .w-btn.active { background: #f1c40f; border-color: #e67e22; box-shadow: 0 0 5px orange; }

        /* Кнопка Супер */
        #super-btn { position: absolute; bottom: 140px; right: 20px; width: 70px; height: 70px; border-radius: 50%; background: #2d3436; color: white; border: 4px solid #636e72; font-weight: bold; font-size: 10px; z-index: 30; pointer-events: auto; }
        #super-btn.ready { background: #e74c3c; border-color: #f1c40f; box-shadow: 0 0 15px #e74c3c; }

        /* Полоска перегрева */
        #heat-cont { width: 150px; height: 8px; background: #ddd; border: 1px solid #333; border-radius: 4px; overflow: hidden; display: none; }
        #heat-bar { height: 100%; width: 0%; background: orange; }

        #death-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.9); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

<div id="death-screen">
    <h1>ТЫ ПРОИГРАЛ</h1>
    <button style="padding: 15px 30px;" onclick="location.reload()">РЕСТАРТ</button>
</div>

<div id="stats" class="panel">
    <div style="color:red">❤️ HP: <span id="hp">100</span></div>
    <div style="color:blue">🛡️ ARM: <span id="arm">0</span></div>
    <div style="color:orange">💰 <span id="coins">0</span></div>
    <div style="font-size:10px">Room: <span id="room">1</span></div>
</div>

<div id="weapon-info" class="panel">
    <b id="w-name">Оружие</b><br>
    <span id="w-super">Super: ???</span>
</div>

<button id="super-btn" onclick="activateSuper()">SUPER<br>100💰</button>

<div id="bottom-ui">
    <div id="heat-cont"><div id="heat-bar"></div></div>
    <div id="weapon-dock">
        <button class="w-btn active" onclick="setW(0)">Базука</button>
        <button class="w-btn" onclick="setW(1)">Автомат</button>
        <button class="w-btn" onclick="setW(2)">2 Пистоля</button>
        <button class="w-btn" onclick="setW(3)">Меч</button>
        <button class="w-btn" onclick="setW(4)">Миниган</button>
        <button class="w-btn" onclick="setW(5)">Дробовик</button>
        <button class="w-btn" onclick="setW(6)">Клинок</button>
        <button class="w-btn" onclick="setW(7)">Сингуляр</button>
    </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let w, h, room = 1, coins = 100, armor = 0, frame = 0;

const player = { x:0, y:0, r:18, hp:100, wIdx:0, rel:0, heat:0, over:false, sAct:0, sType:'' };
const WEAPONS = [
    { n: "Базука", s: "Nuke", d: 100, r: 120, sp: 7, c: "#e67e22" },
    { n: "Автомат", s: "Fire Storm", d: 15, r: 8, sp: 13, c: "#f1c40f" },
    { n: "2 Пистолета", s: "Elements", d: 25, r: 14, sp: 15, c: "#3498db" },
    { n: "Меч", s: "Blade Dance", d: 70, r: 35, range: 130, c: "#95a5a6" },
    { n: "Миниган", s: "No Overheat", d: 12, r: 4, sp: 18, c: "#2d3436" },
    { n: "Дробовик", s: "Circle Shot", d: 18, r: 55, sp: 10, c: "#7f8c8d" },
    { n: "Клинок", s: "Vampire", d: 40, r: 25, range: 100, c: "#c0392b" },
    { n: "Сингуляр", s: "Black Hole", d: 5, r: 150, sp: 5, c: "#6c5ce7" }
];

let enemies = [], bullets = [], singularities = [], items = [];
const input = { mL:{id:null,x:0,y:0}, mR:{id:null,x:0,y:0}, move:{x:0,y:0,a:false}, shoot:{ang:0,a:false} };

function resize() { w=window.innerWidth; h=window.innerHeight; canvas.width=w; canvas.height=h; }
window.addEventListener('resize', resize); resize();

function setW(i) {
    if(i === 4 && coins < 300 && !WEAPONS[4].unlocked) { alert("Миниган стоит 300💰"); return; }
    if(i === 4) WEAPONS[4].unlocked = true;
    player.wIdx = i;
    document.querySelectorAll('.w-btn').forEach((b,idx)=>b.classList.toggle('active', idx===i));
    document.getElementById('w-name').innerText = WEAPONS[i].n;
    document.getElementById('w-super').innerText = "Super: " + WEAPONS[i].s;
    document.getElementById('heat-cont').style.display = (i === 4) ? "block" : "none";
}

function activateSuper() {
    if(coins < 100 || player.sAct > 0) return;
    coins -= 100; player.sAct = 300; player.sType = WEAPONS[player.wIdx].n;
}

class Enemy {
    constructor(x, y, type) {
        this.x=x; this.y=y; this.type=type; this.dead=false;
        this.hp = 100 + room*20; this.s = 30; this.sp = 1.8;
        this.st = {f:0, i:0, p:0};
        if(type==='titan') { this.hp*=8; this.s=70; this.sp=0.8; }
        if(type==='coloss') { this.hp*=20; this.s=120; this.sp=0.4; }
        if(type==='healer') { this.hp*=1.5; this.sp=1.2; }
        this.max = this.hp;
    }
    update() {
        let dx=player.x-this.x, dy=player.y-this.y, d=Math.hypot(dx,dy);
        let m = 1;
        if(this.st.i > 0) { m=0.3; this.st.i--; }
        if(this.st.f > 0) { this.hp-=0.2; m*=0.7; this.st.f--; }
        if(this.st.p > 0) { this.hp-=0.4; this.st.p--; }

        if(this.type === 'healer') {
            let t = enemies.find(e=>e!==this && e.hp < e.max);
            if(t) { let tx=t.x-this.x, ty=t.y-this.y, td=Math.hypot(tx,ty); this.x+=(tx/td)*this.sp*m; this.y+=(ty/td)*this.sp*m; t.hp+=0.1; }
        } else {
            this.x+=(dx/d)*this.sp*m; this.y+=(dy/d)*this.sp*m;
        }
        if(this.type==='coloss' && d < 150 && frame%60===0) dealDmg(10);
        if(d < player.r + this.s/2) dealDmg(0.5);
    }
    draw() {
        ctx.fillStyle = this.type==='healer'?'#2ecc71':this.type==='coloss'?'#e67e22':'#7f8c8d';
        if(this.st.i>0) ctx.fillStyle='#74b9ff';
        ctx.fillRect(this.x-this.s/2, this.y-this.s/2, this.s, this.s);
        ctx.fillStyle='red'; ctx.fillRect(this.x-this.s/2, this.y-this.s/2-8, this.s, 4);
        ctx.fillStyle='green'; ctx.fillRect(this.x-this.s/2, this.y-this.s/2-8, this.s*(this.hp/this.max), 4);
    }
}

function dealDmg(v) { if(armor>0) { armor-=v; if(armor<0) { player.hp+=armor; armor=0; } } else player.hp-=v; }

function shoot(x, y, a, sp, col, dmg, pl, spec=null) {
    bullets.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, c:col, d:dmg, pl, spec, l:200 });
}

function spawnRoom() {
    enemies=[]; bullets=[]; singularities=[]; items=[];
    player.x=w/2; player.y=h/2;
    let count = 5 + room*2;
    for(let i=0; i<count; i++) {
        let t='norm';
        if(i===0 && room>3) t='titan';
        if(i===1 && room>10) t='coloss';
        if(i===2 && room>5) t='healer';
        enemies.push(new Enemy(Math.random()*w, Math.random()*h, t));
    }
}

function loop() {
    if(player.hp<=0) { document.getElementById('death-screen').style.display='flex'; return; }
    frame++; ctx.clearRect(0,0,w,h);
    
    // Grid
    ctx.strokeStyle='#eee'; for(let i=0;i<w;i+=50){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,h);ctx.stroke();}

    if(input.move.a) { player.x+=input.move.x*4.5; player.y+=input.move.y*4.5; }
    ctx.fillStyle='#0984e3'; ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,Math.PI*2); ctx.fill();

    let wp = WEAPONS[player.wIdx];
    if(player.rel>0) player.rel--;
    if(player.sAct>0) { player.sAct--; document.getElementById('super-btn').innerText = "ACTIVE"; }
    else { document.getElementById('super-btn').innerText = (coins>=100?"READY":"100💰"); }
    document.getElementById('super-btn').classList.toggle('ready', coins>=100 && player.sAct<=0);

    if(input.shoot.a && player.rel<=0 && !player.over) {
        let a = input.shoot.ang;
        if(wp.n==="Меч"||wp.n==="Клинок") {
            enemies.forEach(e=>{
                if(Math.hypot(e.x-player.x,e.y-player.y)<wp.range && Math.abs(a-Math.atan2(e.y-player.y,e.x-player.x))<1) {
                    e.hp-=wp.d; if(wp.n==="Клинок") e.st.p=200;
                    if(player.sAct>0 && wp.n==="Клинок") player.hp=Math.min(100, player.hp+3);
                }
            });
            player.rel=wp.r;
        } else if(wp.n==="Сингуляр") {
            shoot(player.x,player.y,a,wp.sp,wp.c,0,true,"sing"); player.rel=wp.r;
        } else if(wp.n==="Миниган") {
            shoot(player.x,player.y,a+(Math.random()-0.5)*0.2,wp.sp,wp.c,wp.d,true);
            if(player.sAct<=0) { player.heat++; if(player.heat>=30) player.over=true; }
            player.rel=wp.r;
        } else {
            shoot(player.x,player.y,a,wp.sp,wp.c,wp.d,true); player.rel=wp.r;
        }
    }

    if(player.over) { player.heat-=0.1; if(player.heat<=0) player.over=false; }
    else if(player.heat>0) player.heat-=0.05;
    document.getElementById('heat-bar').style.width = (player.heat/30*100)+"%";

    singularities.forEach((s,i)=>{
        ctx.fillStyle='rgba(108,92,231,0.2)'; ctx.beginPath(); ctx.arc(s.x,s.y,150,0,Math.PI*2); ctx.fill();
        enemies.forEach(e=>{ if(Math.hypot(e.x-s.x,e.y-s.y)<150){ e.x+=(s.x-e.x)*0.05; e.y+=(s.y-e.y)*0.05; e.hp-=0.5; } });
        s.l--; if(s.l<=0) singularities.splice(i,1);
    });

    bullets.forEach((b,i)=>{
        b.x+=b.vx; b.y+=b.vy;
        ctx.fillStyle=b.c; ctx.beginPath(); ctx.arc(b.x,b.y,5,0,Math.PI*2); ctx.fill();
        if(b.pl) {
            enemies.forEach(e=>{
                if(Math.hypot(e.x-b.x,e.y-b.y)<e.s/2) { e.hp-=b.d; b.l=0; }
            });
            if(b.spec==="sing" && b.l<150) { singularities.push({x:b.x,y:b.y,l:180}); b.l=0; }
        } else if(Math.hypot(player.x-b.x,player.y-b.y)<player.r) { dealDmg(b.d); b.l=0; }
        b.l--; if(b.l<=0) bullets.splice(i,1);
    });

    enemies.forEach((e,i)=>{ e.update(); e.draw(); if(e.hp<=0) { coins+=15; enemies.splice(i,1); } });
    if(enemies.length===0) { room++; spawnRoom(); }

    document.getElementById('hp').innerText=Math.floor(player.hp);
    document.getElementById('arm').innerText=Math.floor(armor);
    document.getElementById('coins').innerText=coins;
    document.getElementById('room').innerText=room;
    requestAnimationFrame(loop);
}

// Touch Controls
window.addEventListener('touchstart', e=>{
    for(let t of e.changedTouches) {
        if(t.target.tagName==='BUTTON') continue;
        if(t.clientX < w/2) { input.mL={id:t.identifier,sx:t.clientX,sy:t.clientY}; input.move.a=true; }
        else { input.mR={id:t.identifier,sx:t.clientX,sy:t.clientY}; input.shoot.a=true; }
    }
});
window.addEventListener('touchmove', e=>{
    for(let t of e.changedTouches) {
        if(t.identifier===input.mL.id) {
            let dx=t.clientX-input.mL.sx, dy=t.clientY-input.mL.sy, d=Math.min(Math.hypot(dx,dy),40);
            input.move.x=dx/d; input.move.y=dy/d;
        }
        if(t.identifier===input.mR.id) input.shoot.ang=Math.atan2(t.clientY-input.mR.sy, t.clientX-input.mR.sx);
    }
});
window.addEventListener('touchend', e=>{
    for(let t of e.changedTouches) {
        if(t.identifier===input.mL.id) input.move.a=false;
        if(t.identifier===input.mR.id) input.shoot.a=false;
    }
});

setW(0); spawnRoom(); loop();
</script>
</body>
</html>

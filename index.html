<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underground: Light & Fixed</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #f0f2f5; overflow: hidden; touch-action: none; font-family: 'Segoe UI', sans-serif; color: #333; }
        canvas { display: block; }
        
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; background: rgba(255,255,255,0.7); padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        #money-display { color: #d35400; font-weight: bold; }
        
        #weapon-dock { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; width: 95%; }
        .w-btn { padding: 6px 10px; background: #fff; border: 2px solid #ddd; color: #333; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .w-btn.active { border-color: #e74c3c; background: #ffeaa7; }

        #super-btn { position: absolute; bottom: 20px; right: 20px; width: 70px; height: 70px; border-radius: 50%; background: #dfe6e9; border: 4px solid #b2bec3; color: #636e72; font-weight: bold; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; transition: 0.3s; }
        #super-btn.ready { background: #fdcb6e; border-color: #f1c40f; color: #000; box-shadow: 0 0 15px rgba(241,196,15,0.5); cursor: pointer; }

        #shop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .shop-card { background: #fff; padding: 15px; border-radius: 12px; text-align: center; margin: 5px; border: 2px solid #dfe6e9; width: 180px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .buy-btn { background: #2ecc71; border: none; color: white; padding: 10px; border-radius: 6px; width: 100%; margin-top: 5px; font-weight: bold; }
        .buy-btn:disabled { background: #bdc3c7; }
        
        .joystick { position: absolute; width: 80px; height: 80px; background: rgba(0,0,0,0.1); border-radius: 50%; border: 2px solid rgba(0,0,0,0.15); display: none; }
        .knob { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; background: rgba(0,0,0,0.3); border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div style="font-weight: bold;">Комната: <span id="roomNum">1</span> / 10</div>
        <div style="color: #e74c3c; font-weight: bold;">HP: <span id="hp">100</span></div>
        <div id="money-display">💰 <span id="coins">0</span></div>
        <div id="kill-ui" style="font-size: 12px;">Заряжаем Супер: <span id="killsNeeded">5</span></div>
    </div>

    <button id="super-btn" onclick="activateSuper()">SUPER NOT READY</button>

    <div id="weapon-dock">
        <button class="w-btn active" onclick="changeW(0)">Базука</button>
        <button class="w-btn" onclick="changeW(1)">Автомат</button>
        <button class="w-btn" onclick="changeW(2)">Пистолет</button>
        <button class="w-btn" onclick="changeW(3)">Меч</button>
        <button class="w-btn" onclick="changeW(4)">Кинжалы</button>
        <button class="w-btn" onclick="changeW(5)">Бластер</button>
        <button class="w-btn" onclick="changeW(6)">Сингуляр</button>
    </div>

    <div id="shop-overlay">
        <h2 style="color: #2d3436;">УЛУЧШЕНИЯ</h2>
        <div style="display: flex; flex-wrap: wrap; justify-content: center;">
            <div class="shop-card"><h4>УРОН (+30%)</h4><p>Цена: <span id="c-dmg">60</span></p><button class="buy-btn" onclick="buy('dmg')">КУПИТЬ</button></div>
            <div class="shop-card"><h4>ЖИЗНЬ (+25)</h4><p>Цена: <span id="c-hp">50</span></p><button class="buy-btn" onclick="buy('hp')">КУПИТЬ</button></div>
        </div>
        <button style="margin-top:20px; padding: 12px 40px; background: #3498db; border: none; color: white; border-radius: 8px; font-weight: bold;" onclick="closeShop()">В ПУТЬ →</button>
    </div>

    <div id="j-left" class="joystick"><div class="knob"></div></div>
    <div id="j-right" class="joystick"><div class="knob"></div></div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() { w = window.innerWidth; h = window.innerHeight; canvas.width = w; canvas.height = h; }
    window.addEventListener('resize', resize); resize();

    let currentRoom = 1, coins = 0, isGameOver = false, isShopOpen = false;
    let kills = 0, superCooldown = 0;

    const player = { x: 0, y: 0, r: 18, hp: 100, maxHp: 100, speed: 4.8, dmgM: 1, wIdx: 0, rel: 0 };
    const upgrades = { dmg: { cost: 60 }, hp: { cost: 50 } };

    const WEAPONS = [
        { name: "Базука", type: "exp", dmg: 85, delay: 140, bS: 6, color: "#e67e22", expR: 90 }, 
        { name: "Автомат", type: "rap", dmg: 16, delay: 10, bS: 12, color: "#f1c40f", mag: 25, rel: 110 },
        { name: "Пистолет", type: "single", dmg: 40, delay: 22, bS: 13, color: "#3498db" },
        { name: "Меч", type: "melee", dmg: 60, delay: 38, range: 115, arc: 1.1, color: "#7f8c8d" },
        { name: "Кинжалы", type: "melee", dmg: 35, delay: 11, range: 45, arc: 0.7, color: "#2d3436" },
        { name: "Бластер", type: "laser", dmg: 65, delay: 20, bS: 17, color: "#00b894", bounce: 3 }, 
        { name: "Сингуляр", type: "grav", dmg: 4, delay: 170, bS: 3.5, color: "#6c5ce7" }
    ];

    let bullets = [], enemies = [], parts = [];
    const input = { move: {x:0, y:0, active:false}, shoot: {x:0, y:0, active:false, ang:0} };

    function changeW(i) { player.wIdx = i; document.querySelectorAll('.w-btn').forEach((b,idx)=>b.classList.toggle('active', idx===i)); }

    function activateSuper() {
        if (kills < 5 || superCooldown > 0) return;
        let wp = WEAPONS[player.wIdx];
        if(wp.type === 'exp') { for(let i=0; i<8; i++) spawnBullet(player.x, player.y, i*(Math.PI/4), wp); }
        if(wp.type === 'rap') { player.rel = -300; }
        if(wp.type === 'single') { for(let i=0; i<12; i++) spawnBullet(player.x, player.y, i*(Math.PI/6), wp); }
        if(wp.type === 'melee') { player.dmgM *= 4; setTimeout(()=>player.dmgM /= 4, 4000); }
        if(wp.type === 'laser') { for(let i=0; i<25; i++) spawnBullet(player.x, player.y, Math.random()*Math.PI*2, wp); }
        kills = 0; superCooldown = 600; updateUI();
    }

    function spawnBullet(x, y, ang, wp) {
        bullets.push({ x, y, vx: Math.cos(ang)*wp.bS, vy: Math.sin(ang)*wp.bS, wp, isPl: true, bounces: wp.bounce||0, active: true });
    }

    class Enemy {
        constructor(x, y, type) {
            this.x = x; this.y = y; this.type = type; this.active = true;
            this.hp = (type==='titan'? 900 : 50) + (currentRoom * 18);
            this.maxHp = this.hp; this.s = type==='titan'? 75 : 28;
            this.speed = type==='titan'? 0.7 : 1.8 + Math.random();
        }
        update() {
            let dx = player.x-this.x, dy = player.y-this.y, d = Math.hypot(dx,dy);
            this.x += (dx/d)*this.speed; this.y += (dy/d)*this.speed;
            if(d < player.r + this.s/2) player.hp -= 0.35;
        }
        draw() {
            ctx.fillStyle = this.type==='titan'?'#d63031':'#b2bec3';
            ctx.fillRect(this.x-this.s/2, this.y-this.s/2, this.s, this.s);
            ctx.strokeStyle = "#2d3436"; ctx.lineWidth = 1; ctx.strokeRect(this.x-this.s/2, this.y-this.s/2, this.s, this.s);
        }
    }

    function startRoom() {
        isShopOpen = false; document.getElementById('shop-overlay').style.display='none';
        player.x = w/2; player.y = h/2;
        bullets = []; enemies = []; parts = [];
        let count = 4 + currentRoom;
        for(let i=0; i<count; i++) {
            let ex, ey;
            do { ex=Math.random()*w; ey=Math.random()*h; } while(Math.hypot(ex-player.x, ey-player.y)<250);
            enemies.push(new Enemy(ex, ey, (i===0 && currentRoom > 4)?'titan':'norm'));
        }
        updateUI();
    }

    function buy(t) {
        if(coins >= upgrades[t].cost) {
            coins -= upgrades[t].cost;
            if(t==='hp') { player.maxHp += 25; player.hp = player.maxHp; }
            if(t==='dmg') { player.dmgM += 0.3; }
            upgrades[t].cost += 45;
            updateUI(); updateShopUI();
        }
    }

    function updateShopUI() {
        document.getElementById('c-dmg').innerText = upgrades.dmg.cost;
        document.getElementById('c-hp').innerText = upgrades.hp.cost;
    }

    function updateUI() {
        document.getElementById('hp').innerText = Math.floor(player.hp);
        document.getElementById('coins').innerText = coins;
        document.getElementById('roomNum').innerText = currentRoom;
        document.getElementById('killsNeeded').innerText = Math.max(0, 5 - kills);
        const btn = document.getElementById('super-btn');
        if(kills >= 5 && superCooldown <= 0) { btn.classList.add('ready'); btn.innerText = "READY!"; } 
        else { btn.classList.remove('ready'); btn.innerText = superCooldown > 0 ? `КД ${Math.ceil(superCooldown/60)}с` : "ЗАРЯД..."; }
    }

    function loop() {
        if(isGameOver || isShopOpen) { requestAnimationFrame(loop); return; }
        ctx.fillStyle = '#f0f2f5'; ctx.fillRect(0,0,w,h);
        
        // Сетка для вида
        ctx.strokeStyle = '#dfe6e9'; ctx.lineWidth = 1;
        for(let i=0; i<w; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
        for(let i=0; i<h; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(w,i); ctx.stroke(); }

        if(superCooldown > 0) { superCooldown--; if(superCooldown === 0) updateUI(); }

        // Игрок
        if(input.move.active) {
            player.x = Math.max(player.r, Math.min(w-player.r, player.x + input.move.x*player.speed));
            player.y = Math.max(player.r, Math.min(h-player.r, player.y + input.move.y*player.speed));
        }
        ctx.fillStyle = '#0984e3'; ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();

        // Стрельба
        if(player.rel > 0) player.rel--;
        if(input.shoot.active && player.rel <= 0) {
            let wp = WEAPONS[player.wIdx];
            if(wp.type === 'melee') {
                parts.push({x:player.x, y:player.y, ang:input.shoot.ang, r:wp.range, arc:wp.arc, life:5});
                enemies.forEach(e => {
                    let d = Math.hypot(e.x-player.x, e.y-player.y);
                    if(d < wp.range && Math.abs(input.shoot.ang - Math.atan2(e.y-player.y, e.x-player.x)) < wp.arc) e.hp -= wp.dmg * player.dmgM;
                });
            } else spawnBullet(player.x, player.y, input.shoot.ang, wp);
            player.rel = wp.delay;
        }

        // Пули
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            if(b.x<0 || b.x>w || b.y<0 || b.y>h) {
                if(b.bounces > 0) { 
                    if(b.x<0 || b.x>w) b.vx *= -1; else b.vy *= -1; 
                    b.bounces--; 
                } else b.active = false;
            }
            enemies.forEach(e => {
                if(Math.hypot(b.x-e.x, b.y-e.y) < e.s/2 + 5) {
                    if(b.wp.type === 'exp') {
                        enemies.forEach(en => { if(Math.hypot(en.x-b.x, en.y-b.y)<b.wp.expR) en.hp -= b.wp.dmg*player.dmgM; });
                    } else e.hp -= b.wp.dmg*player.dmgM;
                    b.active = false;
                }
            });
        });
        bullets = bullets.filter(b => b.active);

        // Враги
        enemies.forEach((e, i) => {
            e.update(); e.draw();
            if(e.hp <= 0) { coins += (e.type==='titan'? 60 : 12); kills++; enemies.splice(i, 1); updateUI(); }
        });

        // Эффекты взмаха
        parts.forEach((p, i) => {
            ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, p.ang-p.arc, p.ang+p.arc); ctx.stroke();
            p.life--; if(p.life <= 0) parts.splice(i, 1);
        });

        if(enemies.length === 0) { isShopOpen = true; document.getElementById('shop-overlay').style.display='flex'; updateShopUI(); }
        if(player.hp <= 0) { alert("КОНЕЦ ИГРЫ! Собрано монет: " + coins); location.reload(); }
        requestAnimationFrame(loop);
    }

    function closeShop() { currentRoom++; if(currentRoom > 10) alert("ПОБЕДА!"); else startRoom(); }

    // Управление
    const jL = document.getElementById('j-left'), jR = document.getElementById('j-right');
    let tLId = null, tRId = null, sL = {x:0,y:0}, sR = {x:0,y:0};

    window.addEventListener('touchstart', e => {
        for(let t of e.changedTouches) {
            if(t.target.tagName === 'BUTTON') continue;
            if(t.clientX < w/2 && tLId === null) {
                tLId = t.identifier; sL = {x:t.clientX, y:t.clientY};
                jL.style.display='block'; jL.style.left=(sL.x-40)+'px'; jL.style.top=(sL.y-40)+'px';
                input.move.active = true;
            } else if(tRId === null) {
                tRId = t.identifier; sR = {x:t.clientX, y:t.clientY};
                jR.style.display='block'; jR.style.left=(sR.x-40)+'px'; jR.style.top=(sR.y-40)+'px';
                input.shoot.active = true;
            }
        }
    });

    window.addEventListener('touchmove', e => {
        for(let t of e.changedTouches) {
            if(t.identifier === tLId) {
                let dx=t.clientX-sL.x, dy=t.clientY-sL.y, d=Math.min(Math.hypot(dx,dy),40), a=Math.atan2(dy,dx);
                input.move.x=Math.cos(a)*(d/40); input.move.y=Math.sin(a)*(d/40);
                jL.querySelector('.knob').style.transform=`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;
            }
            if(t.identifier === tRId) {
                let dx=t.clientX-sR.x, dy=t.clientY-sR.y, d=Math.min(Math.hypot(dx,dy),40), a=Math.atan2(dy,dx);
                input.shoot.ang = a;
                jR.querySelector('.knob').style.transform=`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;
            }
        }
    }, {passive:false});

    window.addEventListener('touchend', e => {
        for(let t of e.changedTouches) {
            if(t.identifier === tLId) { tLId=null; input.move.active=false; jL.style.display='none'; }
            if(t.identifier === tRId) { tRId=null; input.shoot.active=false; jR.style.display='none'; }
        }
    });

    startRoom(); loop();
</script>
</body>
</html>

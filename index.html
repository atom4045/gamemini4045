<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underground: Zero Bugs Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; background-color: #111; }

        /* Верхняя панель HUD */
        #hud-top { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; z-index: 100; }
        .hud-box { background: rgba(20, 20, 20, 0.85); color: #fff; padding: 12px 18px; border-radius: 10px; border: 2px solid #333; font-size: 16px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .text-red { color: #ff4757; } .text-blue { color: #1e90ff; } .text-gold { color: #ffa502; }

        /* Панель текущего оружия */
        .weapon-info { text-align: right; }
        #w-name { font-size: 18px; color: #fff; }
        #w-super-text { font-size: 12px; color: #ff7f50; display: block; margin-top: 4px; }

        /* Кнопка Супер-способности */
        #super-btn { 
            position: absolute; bottom: 180px; right: 30px; width: 90px; height: 90px; 
            border-radius: 50%; background: #2f3542; color: #747d8c; border: 4px solid #57606f;
            font-weight: bold; font-size: 14px; z-index: 200; pointer-events: auto; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.2s; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #super-btn.ready { background: #ff4757; color: #fff; border-color: #ffa502; box-shadow: 0 0 25px #ff4757; animation: pulse 1s infinite; }
        #super-btn.active { background: #ffa502; color: #000; border-color: #fff; box-shadow: 0 0 30px #ffa502; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Док выбора оружия */
        #weapon-dock { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 96%; display: flex; flex-direction: column; gap: 8px; z-index: 150; }
        #heat-bar-bg { width: 60%; height: 12px; background: #222; border-radius: 6px; border: 2px solid #444; align-self: center; overflow: hidden; display: none; }
        #heat-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffa502, #ff4757); transition: width 0.1s; }
        
        #w-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; pointer-events: auto; }
        .w-btn { 
            background: #2f3542; color: #dfe4ea; border: 2px solid #57606f; padding: 12px 4px; 
            border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .w-btn.active { background: #ffa502; color: #111; border-color: #ff4757; }

        /* Экраны состояний */
        #death-screen, #start-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.9); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .btn-large { padding: 15px 40px; font-size: 22px; background: #ff4757; border: none; color: white; border-radius: 12px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        #start-screen { display: none; } /* Скрыт по умолчанию, запускается сразу */
    </style>
</head>
<body>

<div id="hud-top">
    <div class="hud-box">
        <span class="text-red">❤ <span id="ui-hp">100</span></span> &nbsp;|&nbsp; 
        <span class="text-blue">🛡 <span id="ui-arm">0</span></span> &nbsp;|&nbsp; 
        <span class="text-gold">💰 <span id="ui-coins">150</span></span>
        <div style="font-size: 12px; margin-top: 5px; color: #a4b0be;">Этаж: <span id="ui-room">1</span></div>
    </div>
    <div class="hud-box weapon-info">
        <div id="w-name">Оружие</div>
        <span id="w-super-text">Super: Готов</span>
        <div id="super-timer" style="font-size:10px; color:#fff; display:none;">Осталось: <span id="ui-stime">0</span></div>
    </div>
</div>

<button id="super-btn" onclick="activateSuper()">SUPER<br>100💰</button>

<div id="weapon-dock">
    <div id="heat-bar-bg"><div id="heat-bar-fill"></div></div>
    <div id="w-grid">
        <button class="w-btn active" onclick="equipWeapon(0)">Базука</button>
        <button class="w-btn" onclick="equipWeapon(1)">Автомат</button>
        <button class="w-btn" onclick="equipWeapon(2)">Пистолеты</button>
        <button class="w-btn" onclick="equipWeapon(3)">Меч</button>
        <button class="w-btn" onclick="equipWeapon(4)">Миниган</button>
        <button class="w-btn" onclick="equipWeapon(5)">Дробовик</button>
        <button class="w-btn" onclick="equipWeapon(6)">Клинок</button>
        <button class="w-btn" onclick="equipWeapon(7)">Сингуляр</button>
    </div>
</div>

<div id="death-screen" style="display:none;">
    <h1 style="color: #ff4757; font-size: 40px; margin: 0;">ВЫ МЕРТВЫ</h1>
    <p style="font-size: 20px;">Достигнут этаж: <span id="final-room">1</span></p>
    <button class="btn-large" onclick="location.reload()">ИГРАТЬ СНОВА</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * ==========================================
 * UNDERGROUND: ДВИЖОК V3 (STABLE)
 * ==========================================
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;
let frameCount = 0;
let gameState = 'playing'; // 'playing', 'dead'

// Глобальные переменные экономики и прогресса
let coins = 150;
let room = 1;
let armor = 0;
let lastShieldSpawnTime = 0;

// Игрок
const player = {
    x: 0, y: 0, radius: 18,
    hp: 100, maxHp: 100,
    speed: 4.0, // Удобная скорость
    wIdx: 0, // Индекс текущего оружия
    reloadTimer: 0, // Таймер перезарядки
    
    // Перегрев минигана
    heat: 0, maxHeat: 100, isOverheated: false,
    
    // Суперспособность
    superTimer: 0, // Если > 0, супер активен
    
    // Для двойных пистолетов
    dualSide: 1 // 1 или -1
};

// База данных оружия
const WEAPON_DB = [
    { name: "Базука", type: "launcher", dmg: 120, rel: 90, spd: 8, col: "#e67e22", range: 0, superName: "Ядерка (Огромный урон)" },
    { name: "Автомат", type: "rifle", dmg: 15, rel: 7, spd: 16, col: "#f1c40f", range: 0, superName: "Огнемет (Высокая скорость)" },
    { name: "Пистолеты", type: "dual", dmg: 22, rel: 12, spd: 14, col: "#3498db", range: 0, superName: "Стихийный цикл" },
    { name: "Меч", type: "melee", dmg: 75, rel: 30, spd: 0, col: "#bdc3c7", range: 140, superName: "Круговая атака 360°" },
    { name: "Миниган", type: "minigun", dmg: 10, rel: 3, spd: 18, col: "#7f8c8d", range: 0, superName: "Бесконечная лента", price: 300, unlocked: false },
    { name: "Дробовик", type: "shotgun", dmg: 18, rel: 45, spd: 12, col: "#95a5a6", range: 0, superName: "Шквал дроби (360°)" },
    { name: "Клинок", type: "blade", dmg: 45, rel: 20, spd: 0, col: "#c0392b", range: 110, superName: "Вампиризм (Лечение)" },
    { name: "Сингуляр", type: "blackhole", dmg: 2, rel: 160, spd: 5, col: "#9b59b6", range: 0, superName: "Коллапс (Огромная дыра)" }
];

// Массивы объектов (ТЕПЕРЬ БЕЗОПАСНЫЕ)
let enemies = [];
let bullets = [];
let particles = [];
let items = [];
let singZones = [];
let dmgTexts = []; // Вылетающие цифры урона
let slashes = []; // Визуальные эффекты меча

// Управление
const input = {
    move: { active: false, x: 0, y: 0, touchId: null, startX: 0, startY: 0 },
    shoot: { active: false, angle: 0, touchId: null, startX: 0, startY: 0 }
};

// ==========================================
// ИНИЦИАЛИЗАЦИЯ И РЕСАЙЗ
// ==========================================
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    if(player.x === 0 && player.y === 0) {
        player.x = W / 2;
        player.y = H / 2;
    }
}
window.addEventListener('resize', resize);
resize();

// ==========================================
// КЛАССЫ ИГРОВЫХ ОБЪЕКТОВ
// ==========================================

class Enemy {
    constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type;
        this.dead = false;
        
        // Базовые статы скалируются от этажа
        let hpMult = 1 + (room * 0.3);
        this.hp = 100 * hpMult;
        this.size = 30;
        this.speed = 1.4 + Math.random() * 0.4;
        
        // Статусные эффекты
        this.fireTicks = 0;
        this.iceTicks = 0;
        this.bleedTicks = 0;
        
        // Настройка классов
        if (type === 'titan') { this.hp *= 6; this.size = 65; this.speed *= 0.6; }
        if (type === 'colossus') { this.hp *= 15; this.size = 110; this.speed *= 0.35; }
        if (type === 'runner') { this.hp *= 0.7; this.size = 22; this.speed *= 1.6; }
        if (type === 'healer') { this.hp *= 1.2; this.size = 35; this.speed *= 1.1; }

        this.maxHp = this.hp;
    }

    takeDamage(amount, type = "normal") {
        if (this.dead) return;
        this.hp -= amount;
        
        // Спавн текста урона
        let tCol = "#fff";
        if(type === "crit") tCol = "#f1c40f";
        if(type === "fire") tCol = "#e74c3c";
        if(type === "poison") tCol = "#9b59b6";
        spawnDmgText(this.x, this.y - this.size/2, Math.floor(amount), tCol);

        if (this.hp <= 0) {
            this.dead = true;
            let reward = (this.type === 'normal' || this.type === 'runner') ? 12 : 50;
            coins += reward;
            createExplosion(this.x, this.y, "#7f8c8d", 8);
        }
    }

    update() {
        if (this.dead) return;

        // Применение статусов
        let currentSpeed = this.speed;
        if (this.iceTicks > 0) { currentSpeed *= 0.3; this.iceTicks--; }
        if (this.fireTicks > 0) { 
            if (frameCount % 10 === 0) this.takeDamage(5, "fire");
            this.fireTicks--; 
        }
        if (this.bleedTicks > 0) {
            if (frameCount % 15 === 0) this.takeDamage(8, "poison");
            this.bleedTicks--;
        }

        let dx = player.x - this.x;
        let dy = player.y - this.y;
        let dist = Math.hypot(dx, dy);

        // Поведение Healer'a
        if (this.type === 'healer') {
            let target = null;
            let lowestHp = 999999;
            for (let e of enemies) {
                if (e !== this && !e.dead && e.hp < e.maxHp && e.hp < lowestHp) {
                    lowestHp = e.hp; target = e;
                }
            }
            if (target) {
                let tx = target.x - this.x;
                let ty = target.y - this.y;
                let tDist = Math.hypot(tx, ty);
                if (tDist > 60) {
                    this.x += (tx / tDist) * currentSpeed;
                    this.y += (ty / tDist) * currentSpeed;
                }
                // Лечение
                if (frameCount % 30 === 0) {
                    target.hp = Math.min(target.maxHp, target.hp + 10);
                    spawnDmgText(target.x, target.y, "+10", "#2ecc71");
                }
            } else {
                this.x += (dx / dist) * currentSpeed; this.y += (dy / dist) * currentSpeed;
            }
        } else {
            // Обычное преследование
            this.x += (dx / dist) * currentSpeed;
            this.y += (dy / dist) * currentSpeed;
        }

        // Урон Колосса по площади
        if (this.type === 'colossus' && dist < 150 && frameCount % 60 === 0) {
            damagePlayer(15);
            createExplosion(this.x, this.y, "#e67e22", 15);
        }

        // Столкновение с игроком
        if (dist < player.radius + this.size/2) {
            damagePlayer(0.5); // Постоянный урон при касании
        }
    }

    draw() {
        ctx.save();
        let baseCol = "#95a5a6";
        if (this.type === 'titan') baseCol = "#34495e";
        if (this.type === 'colossus') baseCol = "#d35400";
        if (this.type === 'runner') baseCol = "#f39c12";
        if (this.type === 'healer') baseCol = "#2ecc71";
        
        // Цвета статусов перекрывают
        if (this.iceTicks > 0) baseCol = "#74b9ff";
        if (this.fireTicks > 0) baseCol = "#ff7675";

        ctx.fillStyle = baseCol;
        // Отрисовка квадратного врага
        ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);

        // Полоска здоровья
        let hpY = this.y - this.size/2 - 10;
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(this.x - this.size/2, hpY, this.size, 5);
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(this.x - this.size/2, hpY, this.size * (this.hp / this.maxHp), 5);
        ctx.restore();
    }
}

// ==========================================
// ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ==========================================

function spawnRoom() {
    enemies = [];
    bullets = [];
    singZones = [];
    items = [];
    slashes = [];
    
    let count = 4 + Math.floor(room * 1.5);
    for(let i = 0; i < count; i++) {
        let spawnX, spawnY;
        // Гарантируем, что враги не спавнятся прямо на игроке
        do {
            spawnX = Math.random() * W;
            spawnY = Math.random() * H;
        } while (Math.hypot(spawnX - player.x, spawnY - player.y) < 250);

        let type = 'normal';
        let r = Math.random();
        if (room >= 3 && i === 0) type = 'titan';
        if (room >= 5 && r < 0.2) type = 'runner';
        if (room >= 8 && i === 1) type = 'healer';
        if (room >= 10 && i === 2) type = 'colossus';

        enemies.push(new Enemy(spawnX, spawnY, type));
    }
}

function damagePlayer(amount) {
    if (armor > 0) {
        armor -= amount;
        if (armor < 0) {
            player.hp += armor; // Отнимаем остаток от хп
            armor = 0;
        }
    } else {
        player.hp -= amount;
    }

    if (player.hp <= 0 && gameState === 'playing') {
        gameState = 'dead';
        document.getElementById('death-screen').style.display = 'flex';
        document.getElementById('final-room').innerText = room;
    }
}

function createExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            col: color,
            life: 20 + Math.random() * 20,
            size: 2 + Math.random() * 4
        });
    }
}

function spawnDmgText(x, y, text, color) {
    dmgTexts.push({
        x: x + (Math.random()-0.5)*20, 
        y: y, 
        text: text, 
        col: color, 
        life: 40, 
        vy: -1
    });
}

function fireBullet(x, y, angle, speed, color, damage, isPlayer, effect = null) {
    bullets.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        col: color,
        dmg: damage,
        isPl: isPlayer,
        effect: effect,
        life: 180, // Живет 180 кадров (~3 секунды)
        dead: false
    });
}

function drawSlashEffect(x, y, angle, range, color) {
    slashes.push({
        x: x, y: y, ang: angle, range: range, col: color,
        life: 12, maxLife: 12
    });
}

// ==========================================
// ЛОГИКА ОРУЖИЯ И СТРЕЛЬБЫ
// ==========================================

function equipWeapon(index) {
    let wp = WEAPON_DB[index];
    if (wp.price && coins < wp.price && !wp.unlocked) {
        alert(`Нужно ${wp.price} монет для покупки!`);
        return;
    }
    if (wp.price && !wp.unlocked) {
        coins -= wp.price;
        wp.unlocked = true;
    }

    player.wIdx = index;
    // Обновление UI кнопок
    let btns = document.querySelectorAll('.w-btn');
    btns.forEach((b, i) => {
        if(i === index) b.classList.add('active');
        else b.classList.remove('active');
    });

    document.getElementById('w-name').innerText = wp.name;
    document.getElementById('w-super-text').innerText = "Super: " + wp.superName;
    
    // Показывать полоску перегрева только для минигана
    document.getElementById('heat-bar-bg').style.display = (wp.type === 'minigun') ? 'block' : 'none';
}

function activateSuper() {
    if (coins >= 100 && player.superTimer <= 0) {
        coins -= 100;
        player.superTimer = 360; // 6 секунд (при 60fps)
    }
}

function handleShooting() {
    let wp = WEAPON_DB[player.wIdx];
    let isSuper = player.superTimer > 0;

    if (input.shoot.active && player.reloadTimer <= 0) {
        let angle = input.shoot.angle;
        let px = player.x;
        let py = player.y;

        // БАЗУКА
        if (wp.type === "launcher") {
            if (isSuper) {
                // ЯДЕРКА: Медленнее летит, огромный взрыв
                fireBullet(px, py, angle, wp.spd * 0.7, "#ff4757", wp.dmg * 3, true, "nuke");
                player.reloadTimer = wp.rel * 1.5;
            } else {
                fireBullet(px, py, angle, wp.spd, wp.col, wp.dmg, true, "explode");
                player.reloadTimer = wp.rel;
            }
        }
        
        // АВТОМАТ
        else if (wp.type === "rifle") {
            if (isSuper) {
                // ОГНЕМЕТ: стреляет почти без перезарядки, поджигает, разброс
                let spread = angle + (Math.random() - 0.5) * 0.3;
                fireBullet(px, py, spread, wp.spd * 1.2, "#e67e22", wp.dmg, true, "fire");
                player.reloadTimer = 3; // Очень быстро
            } else {
                // Обычный автомат (ускорен по твоей просьбе)
                fireBullet(px, py, angle, wp.spd, wp.col, wp.dmg, true, null);
                player.reloadTimer = wp.rel; // 7 кадров - это быстро
            }
        }

        // 2 ПИСТОЛЕТА
        else if (wp.type === "dual") {
            // Чередование стволов слева и справа
            let offsetDist = 15;
            let perpAngle = angle + (Math.PI / 2);
            let spawnX = px + Math.cos(perpAngle) * offsetDist * player.dualSide;
            let spawnY = py + Math.sin(perpAngle) * offsetDist * player.dualSide;
            
            player.dualSide *= -1; // Меняем сторону для следующего выстрела

            let effect = null;
            if (isSuper) {
                // Стихийный цикл (зависит от времени)
                if (player.superTimer > 240) effect = "ice";
                else if (player.superTimer > 120) effect = "fire";
                else effect = "poison";
            }
            fireBullet(spawnX, spawnY, angle, wp.spd, isSuper ? "#fff" : wp.col, wp.dmg, true, effect);
            player.reloadTimer = isSuper ? wp.rel / 2 : wp.rel;
        }

        // МЕЧ
        else if (wp.type === "melee") {
            if (isSuper) {
                // УДАР ВОКРУГ
                drawSlashEffect(px, py, 0, wp.range, "#f1c40f");
                for(let e of enemies) {
                    if (!e.dead && Math.hypot(e.x - px, e.y - py) <= wp.range) {
                        e.takeDamage(wp.dmg * 1.5, "crit");
                    }
                }
                player.reloadTimer = wp.rel;
            } else {
                // Обычный удар
                drawSlashEffect(px, py, angle, wp.range, wp.col);
                for(let e of enemies) {
                    if (!e.dead) {
                        let d = Math.hypot(e.x - px, e.y - py);
                        let aE = Math.atan2(e.y - py, e.x - px);
                        // Проверка дистанции и угла (сектор)
                        if (d <= wp.range && Math.abs(angle - aE) < 1.0) {
                            e.takeDamage(wp.dmg);
                        }
                    }
                }
                player.reloadTimer = wp.rel;
            }
        }

        // МИНИГАН
        else if (wp.type === "minigun") {
            if (!player.

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underground RPG: 10 Rooms</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0f0f0f; overflow: hidden; touch-action: none; font-family: 'Courier New', Courier, monospace; color: white; }
        canvas { display: block; }
        
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; text-shadow: 2px 2px #000; }
        #money-display { color: #f1c40f; font-size: 20px; font-weight: bold; }

        #weapon-dock { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; width: 90%; }
        .w-btn { padding: 8px 12px; background: rgba(0,0,0,0.8); border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 12px; }
        .w-btn.active { border-color: #3498db; background: #2980b9; box-shadow: 0 0 10px #3498db; }

        #shop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .shop-card { background: #2c3e50; padding: 20px; border-radius: 10px; text-align: center; margin: 10px; border: 2px solid #34495e; width: 250px; }
        .shop-card h3 { margin: 0 0 10px 0; color: #f1c40f; }
        .buy-btn { background: #27ae60; border: none; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .buy-btn:disabled { background: #7f8c8d; }
        .next-btn { margin-top: 20px; padding: 15px 40px; background: #3498db; border: none; color: white; font-size: 18px; border-radius: 5px; }

        #joystick-left, #joystick-right { position: absolute; bottom: 60px; width: 100px; height: 100px; background: rgba(255, 255, 255, 0.05); border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.1); display: none; pointer-events: none; }
        .knob { position: absolute; top: 50%; left: 50%; width: 35px; height: 35px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div>Комната: <span id="roomNum">1</span> / 10</div>
        <div style="color: #2ecc71;">HP: <span id="hp">100</span></div>
        <div id="money-display">💰 <span id="coins">0</span></div>
        <div id="ammo-ui" style="color: #e74c3c; font-size: 14px;"></div>
    </div>

    <div id="weapon-dock">
        <button class="w-btn active" onclick="changeW(0)">Базука</button>
        <button class="w-btn" onclick="changeW(1)">Автомат</button>
        <button class="w-btn" onclick="changeW(2)">Пистолеты</button>
        <button class="w-btn" onclick="changeW(3)">Меч</button>
        <button class="w-btn" onclick="changeW(4)">Кинжалы</button>
        <button class="w-btn" onclick="changeW(5)">Бластер</button>
        <button class="w-btn" onclick="changeW(6)">Сингулярность</button>
    </div>

    <div id="shop-overlay">
        <h1>МАГАЗИН ПРОКАЧКИ</h1>
        <div style="display: flex; flex-wrap: wrap; justify-content: center;">
            <div class="shop-card">
                <h3>+ СИЛА (Урон)</h3>
                <p>Цена: <span id="p-dmg-cost">50</span></p>
                <button class="buy-btn" onclick="buyUpgrade('dmg')">КУПИТЬ</button>
            </div>
            <div class="shop-card">
                <h3>+ ВЫНОСЛИВОСТЬ (HP)</h3>
                <p>Цена: <span id="p-hp-cost">40</span></p>
                <button class="buy-btn" onclick="buyUpgrade('hp')">КУПИТЬ</button>
            </div>
            <div class="shop-card">
                <h3>+ ЛОВКОСТЬ (Бег)</h3>
                <p>Цена: <span id="p-speed-cost">60</span></p>
                <button class="buy-btn" onclick="buyUpgrade('speed')">КУПИТЬ</button>
            </div>
        </div>
        <button class="next-btn" onclick="closeShop()">В СЛЕДУЮЩУЮ КОМНАТУ →</button>
    </div>

    <div id="joystick-left"><div class="knob"></div></div>
    <div id="joystick-right"><div class="knob"></div></div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() { w = window.innerWidth; h = window.innerHeight; canvas.width = w; canvas.height = h; }
    window.addEventListener('resize', resize); resize();

    // Глобальные переменные
    let currentRoom = 1;
    let coins = 0;
    let isGameOver = false;
    let isShopOpen = false;

    // Параметры игрока
    const player = {
        x: 0, y: 0, r: 20,
        hp: 100, maxHp: 100,
        baseSpeed: 4.5, dmgMult: 1,
        weaponIdx: 0, reloadTimer: 0, ammo: 0
    };

    const upgrades = {
        dmg: { lvl: 1, cost: 50 },
        hp: { lvl: 1, cost: 40 },
        speed: { lvl: 1, cost: 60 }
    };

    // Конфигурация оружия
    const WEAPONS = [
        { name: "Базука", type: "heavy", dmg: 200, delay: 120, bSpeed: 7, color: "#e67e22", expR: 180, info: "Медленно, мощно" },
        { name: "Автомат", type: "rapid", dmg: 20, delay: 8, bSpeed: 14, color: "#f1c40f", mag: 30, rel: 90, info: "Перезарядка!" },
        { name: "Пистолеты", type: "dual", dmg: 35, delay: 18, bSpeed: 12, color: "#3498db" },
        { name: "Меч", type: "melee", dmg: 120, delay: 35, range: 80, arc: Math.PI * 0.8, color: "#ecf0f1" },
        { name: "Кинжалы", type: "melee", dmg: 50, delay: 10, range: 45, arc: Math.PI * 0.4, color: "#95a5a6" },
        { name: "Бластер", type: "laser", dmg: 30, delay: 15, bSpeed: 20, color: "#00ffcc", bounce: 2 },
        { name: "Сингулярность", type: "gravity", dmg: 10, delay: 150, bSpeed: 4, color: "#9b59b6" }
    ];

    const input = { move: {x:0, y:0, active:false}, shoot: {x:0, y:0, active:false} };
    let entities = { bullets: [], enemies: [], particles: [], coins: [] };

    function changeW(i) { 
        player.weaponIdx = i; 
        player.ammo = WEAPONS[i].mag || 0;
        document.querySelectorAll('.w-btn').forEach((b,idx) => b.classList.toggle('active', idx===i));
    }

    class Bullet {
        constructor(x, y, ang, wp, isPl) {
            this.x = x; this.y = y; this.ang = ang;
            this.wp = wp; this.isPl = isPl;
            this.vx = Math.cos(ang) * wp.bSpeed;
            this.vy = Math.sin(ang) * wp.bSpeed;
            this.active = true; this.life = 200;
            this.bounces = wp.bounce || 0;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if (this.bounces > 0) {
                if (this.x < 0 || this.x > w) { this.vx *= -1; this.bounces--; }
                if (this.y < 0 || this.y > h) { this.vy *= -1; this.bounces--; }
            } else if (this.x<0 || this.x>w || this.y<0 || this.y>h) this.active = false;
            
            if (this.wp.type === 'gravity') {
                entities.enemies.forEach(e => {
                    let d = Math.hypot(e.x - this.x, e.y - this.y);
                    if (d < 150) {
                        e.x += (this.x - e.x) * 0.05;
                        e.y += (this.y - e.y) * 0.05;
                    }
                });
                this.life--;
                if (this.life < 150) { // Взрыв в конце
                    this.active = false;
                    createExplosion(this.x, this.y, 200, 300);
                }
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, (this.wp.type==='heavy'?12:5), 0, Math.PI*2);
            ctx.fillStyle = this.wp.color;
            ctx.fill();
            if(this.wp.type==='laser') {
                ctx.shadowBlur = 10; ctx.shadowColor = this.wp.color;
            }
        }
    }

    class Enemy {
        constructor(x, y, type) {
            this.x = x; this.y = y; this.type = type;
            this.active = true; this.t = 0;
            if (type === 'titan') {
                this.hp = 1200 + (currentRoom * 200); this.s = 80; this.speed = 0.8; this.color = '#c0392b';
            } else {
                this.hp = 60 + (currentRoom * 20); this.s = 30; this.speed = 2 + Math.random(); this.color = '#bdc3c7';
            }
            this.maxHp = this.hp;
        }
        update() {
            let dx = player.x - this.x, dy = player.y - this.y, dist = Math.hypot(dx, dy);
            this.x += (dx/dist) * this.speed;
            this.y += (dy/dist) * this.speed;
            if (dist < player.r + this.s/2) player.hp -= 0.5;
            
            if (this.type === 'titan' && Math.random() < 0.02) {
                for(let a=0; a<Math.PI*2; a+=Math.PI/4) {
                    entities.bullets.push(new Bullet(this.x, this.y, a, {bSpeed:4, color:'#f1c40f', dmg:15}, false));
                }
            }
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x - this.s/2, this.y - this.s/2, this.s, this.s);
            ctx.fillStyle = 'red'; ctx.fillRect(this.x-this.s/2, this.y-this.s/2-10, this.s, 4);
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(this.x-this.s/2, this.y-this.s/2-10, this.s*(this.hp/this.maxHp), 4);
        }
    }

    function createExplosion(x, y, r, dmg) {
        entities.particles.push({x, y, r:0, maxR:r, alpha:1});
        entities.enemies.forEach(e => {
            let d = Math.hypot(e.x - x, e.y - y);
            if (d < r) e.hp -= dmg * (1 - d/r);
        });
    }

    function buyUpgrade(type) {
        let up = upgrades[type];
        if (coins >= up.cost) {
            coins -= up.cost;
            up.lvl++;
            up.cost = Math.floor(up.cost * 1.5);
            if (type === 'hp') { player.maxHp += 50; player.hp = player.maxHp; }
            if (type === 'dmg') player.dmgMult += 0.3;
            if (type === 'speed') player.baseSpeed += 0.5;
            updateShopUI();
            updateUI();
        }
    }

    function updateShopUI() {
        document.getElementById('p-dmg-cost').innerText = upgrades.dmg.cost;
        document.getElementById('p-hp-cost').innerText = upgrades.hp.cost;
        document.getElementById('p-speed-cost').innerText = upgrades.speed.cost;
        document.querySelectorAll('.buy-btn').forEach((btn, i) => {
            let type = ['dmg','hp','speed'][i];
            btn.disabled = coins < upgrades[type].cost;
        });
    }

    function startRoom() {
        isShopOpen = false;
        document.getElementById('shop-overlay').style.display = 'none';
        player.x = w/2; player.y = h/2;
        entities = { bullets:[], enemies:[], particles:[], coins:[] };
        
        let count = 4 + currentRoom * 2;
        for (let i=0; i<count; i++) {
            let ex, ey;
            do { ex = Math.random()*w; ey = Math.random()*h; } while(Math.hypot(ex-player.x, ey-player.y) < 300);
            entities.enemies.push(new Enemy(ex, ey, (i===0 && currentRoom > 3)?'titan':'normal'));
        }
        updateUI();
    }

    function updateUI() {
        document.getElementById('hp').innerText = Math.floor(player.hp);
        document.getElementById('coins').innerText = coins;
        document.getElementById('roomNum').innerText = currentRoom;
        let wp = WEAPONS[player.weaponIdx];
        document.getElementById('ammo-ui').innerText = wp.mag ? `AMMO: ${player.ammo} / ${wp.mag}` : "";
    }

    function loop() {
        if (isGameOver || isShopOpen) { requestAnimationFrame(loop); return; }

        ctx.fillStyle = '#0f0f0f'; ctx.fillRect(0,0,w,h);
        
        // Сетка пола
        ctx.strokeStyle = '#1a1a1a';
        for(let i=0; i<w; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }

        // Игрок
        if (input.move.active) {
            player.x += input.move.x * player.baseSpeed;
            player.y += input.move.y * player.baseSpeed;
        }
        ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
        ctx.fillStyle = '#3498db'; ctx.fill();

        // Стрельба / Атака
        if (player.reloadTimer > 0) player.reloadTimer--;
        
        if (input.shoot.active && player.reloadTimer <= 0) {
            let wp = WEAPONS[player.weaponIdx];
            let ang = Math.atan2(input.shoot.y, input.shoot.x);

            if (wp.type === 'melee') {
                // Визуал взмаха
                entities.particles.push({x:player.x, y:player.y, ang, arc:wp.arc, r:wp.range, life:5, type:'slash'});
                entities.enemies.forEach(e => {
                    let d = Math.hypot(e.x - player.x, e.y - player.y);
                    let a = Math.atan2(e.y - player.y, e.x - player.x);
                    let diff = Math.abs(ang - a);
                    if (d < wp.range && (diff < wp.arc/2 || diff > Math.PI*2 - wp.arc/2)) {
                        e.hp -= wp.dmg * player.dmgMult;
                        e.x += Math.cos(a) * 20; e.y += Math.sin(a) * 20; // Отброс
                    }
                });
            } else {
                if (wp.mag && player.ammo <= 0) {
                    player.reloadTimer = wp.rel; player.ammo = wp.mag;
                } else {
                    entities.bullets.push(new Bullet(player.x, player.y, ang, wp, true));
                    if (wp.mag) player.ammo--;
                    if (wp.type === 'heavy') createExplosion(player.x, player.y, 40, 0); // Мини волна у ствола
                }
            }
            player.reloadTimer = wp.delay;
            updateUI();
        }

        // Пули и коллизии
        entities.bullets.forEach((b, i) => {
            b.update(); b.draw();
            if (!b.active) return;

            if (b.isPl) {
                entities.enemies.forEach(e => {
                    if (Math.hypot(b.x-e.x, b.y-e.y) < e.s/2 + 5) {
                        if (b.wp.type === 'heavy') {
                            createExplosion(b.x, b.y, b.wp.expR, b.wp.dmg * player.dmgMult);
                        } else {
                            e.hp -= b.wp.dmg * player.dmgMult;
                        }
                        b.active = false;
                    }
                });
            } else {
                if (Math.hypot(b.x-player.x, b.y-player.y) < player.r) {
                    player.hp -= b.wp.dmg; b.active = false; updateUI();
                }
            }
        });
        entities.bullets = entities.bullets.filter(b => b.active);

        // Враги
        entities.enemies.forEach((e, i) => {
            e.update(); e.draw();
            if (e.hp <= 0) {
                coins += (e.type==='titan'?150:20);
                entities.enemies.splice(i, 1);
                updateUI();
            }
        });

        // Частицы и взрывы
        entities.particles.forEach((p, i) => {
            if (p.type === 'slash') {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, p.ang - p.arc/2, p.ang + p.arc/2);
                ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 10; ctx.stroke();
                p.life--;
            } else {
                p.r += 15; p.alpha -= 0.05;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.strokeStyle = `rgba(255,255,255,${p.alpha})`; ctx.stroke();
            }
            if (p.alpha <= 0 || p.life <= 0) entities.particles.splice(i, 1);
        });

        // Проверка победы в комнате
        if (entities.enemies.length === 0) {
            isShopOpen = true;
            document.getElementById('shop-overlay').style.display = 'flex';
            updateShopUI();
        }

        if (player.hp <= 0) { isGameOver = true; alert("GAME OVER! Дошли до " + currentRoom + " комнаты"); location.reload(); }

        requestAnimationFrame(loop);
    }

    function closeShop() {
        currentRoom++;
        if (currentRoom > 10) alert("ПОБЕДА! ВЫ ВЫШЛИ НА ПОВЕРХНОСТЬ!");
        else startRoom();
    }

    // Управление
    const jL = document.getElementById('joystick-left'), jLK = jL.querySelector('.knob');
    const jR = document.getElementById('joystick-right'), jRK = jR.querySelector('.knob');
    let tLId = null, tRId = null, sL = {x:0, y:0}, sR = {x:0, y:0};

    window.addEventListener('touchstart', e => {
        for(let t of e.changedTouches) {
            if(t.target.tagName === 'BUTTON') continue;
            if(t.clientX < w/2 && tLId === null) {
                tLId = t.identifier; sL = {x:t.clientX, y:t.clientY};
                jL.style.display='block'; jL.style.left=(sL.x-50)+'px'; jL.style.top=(sL.y-50)+'px';
                input.move.active = true;
            } else if(tRId === null) {
                tRId = t.identifier; sR = {x:t.clientX, y:t.clientY};
                jR.style.display='block'; jR.style.left=(sR.x-50)+'px'; jR.style.top=(sR.y-50)+'px';
                input.shoot.active = true;
            }
        }
    });

    window.addEventListener('touchmove', e => {
        e.preventDefault();
        for(let t of e.changedTouches) {
            if(t.identifier === tLId) {
                let dx=t.clientX-sL.x, dy=t.clientY-sL.y, d=Math.min(Math.hypot(dx,dy),50), a=Math.atan2(dy,dx);
                input.move.x=Math.cos(a)*(d/50); input.move.y=Math.sin(a)*(d/50);
                jLK.style.transform=`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;
            }
            if(t.identifier === tRId) {
                let dx=t.clientX-sR.x, dy=t.clientY-sR.y, a=Math.atan2(dy,dx);
                input.shoot.x=Math.cos(a); input.shoot.y=Math.sin(a);
                let d=Math.min(Math.hypot(dx,dy),50);
                jRK.style.transform=`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;
            }
        }
    }, {passive:false});

    window.addEventListener('touchend', e => {
        for(let t of e.changedTouches) {
            if(t.identifier === tLId) { tLId=null; input.move.active=false; jL.style.display='none'; }
            if(t.identifier === tRId) { tRId=null; input.shoot.active=false; jR.style.display='none'; }
        }
    });

    startRoom();
    loop();
</script>
</body>
</html>
